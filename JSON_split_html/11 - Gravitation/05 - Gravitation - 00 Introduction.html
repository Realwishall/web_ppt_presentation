<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>gravitation.html</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600;700;800&family=Lato:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
--bg: #050510;
  --accent: #6c9bcf;
  --text: #eaeaea;
  --muted: #6b7280;
  --glow: #a78bfa;
  --display: 'Cinzel', serif;
  --body: 'Lato', sans-serif;
  --mono: 'Lato', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
}

/* Persistent 3D layer — OUTSIDE .page */
#canvas-wrap {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--glow) 13%, transparent), transparent 60%), var(--bg);
}
#canvas-wrap canvas { display: block; width: 100% !important; height: 100% !important; }
.vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, color-mix(in srgb, var(--bg) 80%, transparent) 100%);
}

/* Single landing slide */
.page {
  position: relative; z-index: 2;
  height: 100%; box-sizing: border-box;
  overflow: hidden;
  background: transparent;
  color: var(--text);
  font-family: var(--body);
}
.wrap {
  height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 6vmin 7vw 8vmin;
  max-width: 72ch;
  position: relative; z-index: 2;
}
.chapter-badge {
  font-size: clamp(12px, 1.8vmin, 18px);
  letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 1.2vmin; display: block;
  animation: fadeUp 1s ease both;
}
.brand {
  font-family: var(--display);
  color: var(--text);
  text-shadow: 0 2px 40px var(--bg), 0 0 80px var(--bg);
  animation: fadeUp 1s 0.15s ease both;
  margin: 0;
}
.headline {
  animation: fadeUp 1s 0.3s ease both;
  margin: 0;
}
.tagline {
  margin-top: 1.6vmin; color: var(--muted);
  font-size: clamp(14px, 2.2vmin, 22px); max-width: 40ch;
  animation: fadeUp 1s 0.45s ease both;
}
.strip {
  display: flex; flex-wrap: wrap; gap: 1.2vmin;
  margin-top: 3.5vmin; max-width: 70ch;
  animation: fadeUp 1s 0.6s ease both;
}
.tag {
  padding: 1vmin 2vmin; border-radius: 999px;
  font-size: clamp(12px, 1.9vmin, 18px); font-weight: 600;
  color: var(--text);
  border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}
.hint {
  margin-top: 3vmin;
  font-size: clamp(12px, 1.8vmin, 16px);
  color: var(--muted); letter-spacing: 0.04em;
  animation: fadeUp 1s 0.75s ease both;
}

/* Per-chapter hero typography overrides */
.wrap { display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:0;height:100%; \n      .strip { justify-content:center; }
      .brand { font-size:clamp(3rem, 8vw, 7rem); letter-spacing:0.15em; text-transform:uppercase; text-shadow:0 0 60px var(--glow); }
      .headline { font-size:1.4rem; margin-top:1.5rem; letter-spacing:0.1em; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
@media print {
  #canvas-wrap, .vignette, .hint { display: none !important; }
  .page { background: var(--bg) !important; }
  .chapter-badge, .brand, .headline, .tagline, .strip { opacity: 1 !important; transform: none !important; animation: none !important; }
}
</style>
</head>
<body>

<!-- Persistent background siblings (OUTSIDE .page) -->
<div id="canvas-wrap"></div>
<div class="vignette"></div>

<!-- ===== Single chapter landing slide ===== -->
<section class="page">
  <div class="wrap">
    <span class="chapter-badge">Class 11 · Chapter 8</span>
    <h1 class="brand">Gravitation</h1>
    <p class="headline">Orbits written in the sky</p>
    <p class="tagline">Every mass attracts every other mass.</p>
    <div class="strip">
        <span class="tag">Kepler's Laws</span>
        <span class="tag">Universal Law of Gravitation</span>
        <span class="tag">Acceleration due to Gravity</span>
        <span class="tag">Gravitational Potential Energy</span>
        <span class="tag">Satellites &amp; Escape Velocity</span>
      </div>
    <p class="hint no-print">Press <b>Next</b> to begin the chapter</p>
  </div>
</section>

<script>
(function() {
  const ACCENT = 7117775;
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  function size(){
    const w = Math.max(wrap.clientWidth || innerWidth || 1, 1);
    const h = Math.max(wrap.clientHeight || innerHeight || 1, 1);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  size();
  wrap.appendChild(renderer.domElement);
  
      const sun = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshBasicMaterial({ color: 0xfbbf24 }));
      scene.add(sun);
      const planets = [];
      const dists = [2.5, 4, 5.5, 7.5];
      dists.forEach((d,i) => {
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.2+i*0.08, 16, 16), new THREE.MeshBasicMaterial({ color: [0x6c9bcf, 0xa78bfa, 0x34d399, 0xf472b6][i] }));
        scene.add(p); planets.push({ mesh: p, d, speed: 0.8 - i*0.15 });
        const orbit = new THREE.Mesh(new THREE.TorusGeometry(d, 0.01, 8, 64), new THREE.MeshBasicMaterial({ color: 0x334155, transparent: true, opacity: 0.4 }));
        orbit.rotation.x = Math.PI/2; scene.add(orbit);
      });
      const stars = [];
      for (let i = 0; i < 400; i++) {
        const s = new THREE.Mesh(new THREE.SphereGeometry(0.03, 3, 3), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        s.position.set((Math.random()-0.5)*40, (Math.random()-0.5)*40, (Math.random()-0.5)*40);
        scene.add(s);
      }
      camera.position.set(0, 8, 14); camera.lookAt(0,0,0);
      function tick(t) {
        sun.rotation.y = t;
        planets.forEach(p => { p.mesh.position.x = Math.cos(t*p.speed)*p.d; p.mesh.position.z = Math.sin(t*p.speed)*p.d; });
        camera.position.x = Math.sin(t*0.1)*2;
      }
  let t0 = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    const t = (performance.now() - t0) / 1000;
    tick(t);
    renderer.render(scene, camera);
  }
  animate();
  addEventListener('resize', size);
  })();
</script>

<script>
(function(){
  window.addEventListener('load', function(){
    setTimeout(function(){
      if (document.getElementById('__lf-ctl')) return;
      var pages = [].slice.call(document.querySelectorAll('.page'));
      if (!pages.length) return;
      var i = 0, step = 0;
      var steps = function(p){ return [].slice.call(p.querySelectorAll('.step')); };
      function render(){
        pages.forEach(function(p,k){ p.style.display = k===i ? '' : 'none'; });
        steps(pages[i]).forEach(function(s,k){
          s.style.transition = 'opacity .4s, transform .4s';
          s.style.opacity = k < step ? '1' : '0';
          s.style.transform = k < step ? 'none' : 'translateY(14px)';
        });
      }
      function next(){ var n = steps(pages[i]).length;
        if (step < n) step++; else if (i < pages.length-1){ i++; step = 0; } render(); }
      function prev(){ if (step > 0) step--; else if (i > 0){ i--; step = steps(pages[i]).length; } render(); }
      document.addEventListener('keydown', function(e){
        if (e.key === 'ArrowRight' || e.key === ' ') next();
        else if (e.key === 'ArrowLeft') prev();
      });
      render();
    }, 250);
  });
})();
</script>
</body>
</html>

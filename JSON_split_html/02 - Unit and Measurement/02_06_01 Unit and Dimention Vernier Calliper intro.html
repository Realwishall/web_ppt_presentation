<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 - VC &#183; Vernier caliper</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0d0f12;}
body{
  font-family:"Segoe UI",Calibri,Candara,system-ui,sans-serif;
  color:#f2f4f8;
  background:
    radial-gradient(1100px 640px at 12% -12%, rgba(91,140,255,.13), transparent 62%),
    radial-gradient(1000px 620px at 92% 112%, rgba(46,204,154,.10), transparent 62%),
    radial-gradient(900px 520px at 55% 45%, rgba(245,185,66,.045), transparent 70%),
    #0d0f12;
}
body.hidecursor,body.hidecursor *{cursor:none!important}
#stage{
  position:absolute;left:50%;top:50%;
  transform-origin:50% 50%;
}
.page{
  position:absolute;inset:0;
  padding:17px 70px 46px;
}
.page > .wrap{height:100%;display:flex;flex-direction:column;overflow:auto;box-sizing:border-box}
.page.title{padding:46px 70px 46px}
.page.title > .wrap{justify-content:center;align-items:center;text-align:center}

h1.h{
  margin:0 0 4px;font-size:62px;font-weight:800;line-height:1.12;
  letter-spacing:-.01em;color:#f2f4f8;
}
h1.h .lite{color:#9aa4b2;font-weight:600}
.rule{
  height:5px;width:132px;border-radius:99px;flex:none;
  background:linear-gradient(90deg,#5b8cff 0%,#2ecc9a 62%,rgba(46,204,154,0) 100%);
  margin:0 0 14px;
}
.page.title .rule{margin:16px auto 0}
.big{font-size:96px;font-weight:800;line-height:1.08;letter-spacing:-.015em}
.big .g{background:linear-gradient(115deg,#f2f4f8 22%,#5b8cff 92%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.kick{font-size:29px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#5b8cff;margin:0 0 14px}

.content{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;gap:14px}
.cols{display:flex;gap:26px;align-items:flex-start;justify-content:flex-start;flex:0 1 auto;min-height:0}
.col{display:flex;flex-direction:column;justify-content:flex-start;gap:14px;min-width:0;flex:1 1 0}

.card{
  border:1px solid rgba(255,255,255,.10);
  border-left:5px solid #6b7684;
  border-radius:14px;
  padding:14px 20px;
  background:rgba(255,255,255,.035);
  font-size:35px;line-height:1.42;color:#e7ebf2;
}
.card .lbl{display:block;font-size:25px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin:0 0 6px}
.card.question{border-left-color:#5b8cff;background:rgba(91,140,255,.10)}
.card.question .lbl{color:#5b8cff}
.card.solution{border-left-color:#2ecc9a;background:rgba(46,204,154,.10)}
.card.solution .lbl{color:#2ecc9a}
.card.formula{border-left-color:#f5b942;background:rgba(245,185,66,.10)}
.card.formula .lbl{color:#f5b942}
.card.warn{border-left-color:#ff6b6b;background:rgba(255,107,107,.10)}
.card.warn .lbl{color:#ff6b6b}
.card.plain{border-left-color:#3a4250;background:rgba(255,255,255,.03)}

ul.pts{margin:2px 0 0;padding:0 0 0 4px;list-style:none;display:flex;flex-direction:column;gap:9px}
ul.pts li{position:relative;padding-left:30px;font-size:35px;line-height:1.4;color:#e7ebf2}
ul.pts li:before{content:"";position:absolute;left:4px;top:.52em;width:10px;height:10px;border-radius:3px;background:#5b8cff;transform:translateY(-50%)}
ul.pts.g li:before{background:#2ecc9a}
ul.pts li em{font-style:normal;color:#f5b942;font-weight:700}

.muted{color:#9aa4b2}
.acc{color:#5b8cff;font-weight:700}
.gr{color:#2ecc9a;font-weight:700}
.am{color:#f5b942;font-weight:700}
.rd{color:#ff6b6b;font-weight:700}
.blank{white-space:nowrap;color:#f5b942;font-weight:800;border-bottom:2px solid rgba(245,185,66,.55);padding:0 6px}
.no{color:#ff6b6b;font-weight:900;font-size:1.05em}
.yes{color:#2ecc9a;font-weight:900;font-size:1.05em}

.m{font-family:"Cambria Math",Cambria,Georgia,serif;font-style:italic}
.m .up{font-style:normal}
sup{font-size:.62em;vertical-align:super;font-style:normal}
.eq{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:42px;letter-spacing:.01em}

figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
figure img,figure svg{display:block;max-width:100%;height:auto}
figure svg{width:100%}
figcaption{font-size:26px;color:#9aa4b2;text-align:center}


#hint{
  position:fixed;left:0;right:0;bottom:16px;text-align:center;
  font-size:20px;letter-spacing:.14em;color:rgba(154,164,178,.62);
  transition:opacity .9s ease;pointer-events:none;z-index:9;
}
#badge{
  position:fixed;right:20px;bottom:18px;z-index:9;pointer-events:none;
  font-size:20px;font-weight:700;letter-spacing:.05em;color:#cfd6e2;
  background:rgba(20,24,31,.9);border:1px solid rgba(255,255,255,.14);
  padding:7px 14px;border-radius:99px;opacity:0;transition:opacity .35s ease;
}
#badge.on{opacity:1}

/* ---- dense slides: many stacked blocks, tighter rhythm ---- */
.page.dense{padding-bottom:28px}
.page.dense .rule{margin-bottom:10px}
.page.dense h1.h{font-size:58px}
.page.dense .card{font-size:31px;padding:12px 17px;line-height:1.36}
.page.dense .card .lbl{font-size:22px;margin-bottom:4px}
.page.dense ul.pts li{font-size:31px}
.page.dense ul.pts{gap:7px}
.page.dense .eq{font-size:36px}
.page.dense .content,.page.dense .col{gap:11px}
.page.dense figcaption{font-size:23px}
.page.dense figure{max-width:85%}

/* ---- level overrides: buy room for bigger apparent text ---- */
body[data-lvl="5"] .page{padding:15px 52px 34px}
body[data-lvl="5"] .content,body[data-lvl="5"] .col{gap:12px}
body[data-lvl="5"] .cols{gap:22px}
body[data-lvl="5"] h1.h{font-size:58px}
body[data-lvl="5"] .rule{margin-bottom:11px}
body[data-lvl="5"] figure{max-width:96%}
body[data-lvl="5"] .page.dense .card{font-size:30px;padding:10px 15px}
body[data-lvl="5"] .page.dense ul.pts li{font-size:30px}
body[data-lvl="5"] .page.dense .content,body[data-lvl="5"] .page.dense .col{gap:5px}
body[data-lvl="5"] .page.dense figure{max-width:70%}

body[data-lvl="6"] .page{padding:13px 40px 28px}
body[data-lvl="6"] .content,body[data-lvl="6"] .col{gap:10px}
body[data-lvl="6"] .cols{gap:18px}
body[data-lvl="6"] h1.h{font-size:56px}
body[data-lvl="6"] .rule{width:112px;margin-bottom:9px}
body[data-lvl="6"] .card{padding:12px 17px}
body[data-lvl="6"] .big{font-size:88px}
body[data-lvl="6"] figure{max-width:90%}
body[data-lvl="6"] .page.dense .card{font-size:29px;padding:9px 14px}
body[data-lvl="6"] .page.dense .card .lbl{font-size:21px}
body[data-lvl="6"] .page.dense ul.pts li{font-size:29px}
body[data-lvl="6"] .page.dense .eq{font-size:34px}
body[data-lvl="6"] .page.dense .content,body[data-lvl="6"] .page.dense .col{gap:8px}
body[data-lvl="6"] .page.dense figure{max-width:79%}

body[data-lvl="7"] .page{padding:11px 30px 22px}
body[data-lvl="7"] .content,body[data-lvl="7"] .col{gap:9px}
body[data-lvl="7"] .cols{gap:15px}
body[data-lvl="7"] h1.h{font-size:53px}
body[data-lvl="7"] .rule{width:96px;height:4px;margin-bottom:8px}
body[data-lvl="7"] .card{padding:11px 15px}
body[data-lvl="7"] ul.pts li{padding-left:27px}
body[data-lvl="7"] .big{font-size:81px}
body[data-lvl="7"] figure{max-width:84%}
body[data-lvl="7"] figcaption{font-size:23px}
body[data-lvl="7"] .page.dense .card{font-size:27px;padding:8px 13px;line-height:1.32}
body[data-lvl="7"] .page.dense .card .lbl{font-size:20px;margin-bottom:3px}
body[data-lvl="7"] .page.dense ul.pts li{font-size:27px}
body[data-lvl="7"] .page.dense .eq{font-size:32px}
body[data-lvl="7"] .page.dense .content,body[data-lvl="7"] .page.dense .col{gap:7px}
body[data-lvl="7"] .page.dense figure{max-width:74%}
body[data-lvl="7"] .page.dense figcaption{font-size:21px}
</style>
<!-- BEGIN math-font:upright -->
<style data-mathfont="upright">
/* ---- upright math typography (rule 17) ---------------------------------
   Cambria Math is a true math face -- real Greek, real operators, digits on
   the baseline. It was never the font that looked wrong, only the italic.
   System fonts only: no @font-face, no CDN, works with no classroom
   network (rule 2).                                                      */
:root{
  --math-stack:"Cambria Math",Cambria,"STIX Two Math","STIX Two Text","Times New Roman",Georgia,serif;
  --font-math:var(--math-stack);
  --math:var(--math-stack);
}
/* plain (not :where) so these beat the original .m / .eq declarations */
.m,.eq,.fr,.frac,.radical,.scene-readout .ro b{
  font-family:var(--math-stack);
  font-style:normal;
}
.m em,.m i,.eq em,.eq i,.m .up,.eq .up,sup,sub{font-style:normal}
/* MathML: browsers auto-italicise single-letter <mi> via text-transform:math-auto */
math{font-family:var(--math-stack)}
math mi,math mn,math mo,math mtext,math ms{text-transform:none;font-style:normal}
/* zero-specificity so existing .am / .gr / .acc bold spans still win */
:where(.m,.eq,.fr,.frac,.radical){
  font-weight:500;
  font-variant-numeric:lining-nums;
  text-rendering:optimizeLegibility;
}
</style>
<!-- END math-font:upright -->
</head>
<body data-lvl="5">
<div id="stage">
<section class="page dense">
  <div class="wrap">
  <div class="content">
    <div class="cols">
      <div class="col">
        <figure><svg viewBox="0 0 900 344" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="m2h" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f5b942"/></marker><marker id="m2h2" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#f5b942"/></marker></defs><line x1="630.0" y1="24.0" x2="630.0" y2="306.0" stroke="#9aa4b2" stroke-width="1.6" stroke-dasharray="6 6" opacity=".75"/><line x1="420.0" y1="132.0" x2="420.0" y2="306.0" stroke="#9aa4b2" stroke-width="1.6" stroke-dasharray="6 6" opacity=".75"/><rect x="30.0" y="62.0" width="600.0" height="66.0" fill="#9fb0e8" stroke="#7d8fcf" stroke-width="1.5"/><rect x="420.0" y="198.0" width="432.0" height="66.0" fill="#f2ab8e" stroke="#d98a6c" stroke-width="1.5"/><g><rect x="30.0" y="138.0" width="50.7" height="50.0" rx="14.0" fill="#f6cdd8" stroke="#8d95a3" stroke-width="2"/><rect x="80.7" y="138.0" width="23.4" height="50.0" fill="#e9edf3" stroke="#8d95a3" stroke-width="2"/><rect x="104.1" y="138.0" width="249.6" height="50.0" fill="#f7e9b0" stroke="#8d95a3" stroke-width="2"/><line x1="119.7" y1="155.0" x2="353.7" y2="155.0" stroke="#b9a97a" stroke-width="1.4"/><line x1="119.7" y1="171.0" x2="353.7" y2="171.0" stroke="#b9a97a" stroke-width="1.4"/><path d="M353.7,138.0 L420.0,163.0 L353.7,188.0 z" fill="#fbeedd" stroke="#8d95a3" stroke-width="2"/><path d="M392.2,153.0 L420.0,163.0 L392.2,173.0 z" fill="#8d95a3"/></g><line x1="31.0" y1="46.0" x2="630.0" y2="46.0" stroke="#f5b942" stroke-width="2.2" marker-end="url(#m2h)" marker-start="url(#m2h2)"/><text x="330.5" y="32.0" fill="#f5b942" font-size="40" font-family="Cambria,Georgia,serif" font-style="italic" text-anchor="middle">a</text><line x1="421.0" y1="296.0" x2="630.0" y2="296.0" stroke="#f5b942" stroke-width="2.2" marker-end="url(#m2h)" marker-start="url(#m2h2)"/><text x="525.5" y="340.0" fill="#f5b942" font-size="40" font-family="Cambria,Georgia,serif" font-style="italic" text-anchor="middle">b</text></svg><figcaption>Two plain scales, one sliding over the other.</figcaption></figure>
        <div class="card question"><span class="lbl">Question</span>What is the length of the pencil?</div>
        <div class="card solution"><span class="lbl">Answer</span>
          <span class="eq gr step">length = a &#8722; b</span>
        </div>
    </div>
  </div>
  </div>
</section>

</div>
<div id="hint">&#8592; &#8594; &nbsp;&#183;&nbsp; press 1 &#8211; 7 for text size</div>
<div id="badge"></div>
<script>
(function(){
  var W=[1600,1500,1400,1300,1200,1120,1040];
  var PCT=[100,107,114,123,133,143,154];
  var stage=document.getElementById('stage');
  var pages=[].slice.call(document.querySelectorAll('.page'));
  var badge=document.getElementById('badge');
  var hint=document.getElementById('hint');
  var lvl=5, badgeT=null, curT=null;

  try{var s=localStorage.getItem('dbLvl'); if(s){var n=parseInt(s,10); if(n>=1&&n<=7) lvl=n;}}catch(e){}

  function fit(){
    var w=W[lvl-1], h=w*9/16;
    stage.style.width=w+'px';
    stage.style.height=h+'px';
    document.body.setAttribute('data-lvl',String(lvl));
    var s=Math.min(window.innerWidth/w, window.innerHeight/h);
    stage.style.transform='translate(-50%,-50%) scale('+s+')';
    guard();
  }

  /* safety net: never clip. shrink the content block if it would overflow. */
  function guard(){
    pages.forEach(function(pg){
      var c=pg.querySelector('.content')||pg.querySelector('.wrap')||pg;
      c.style.zoom='';
      var z=1, pass=0;
      while(pass<4 && c.scrollHeight>c.clientHeight+3 && z>0.6){
        z=Math.max(0.6, z*Math.min(1, (c.clientHeight-2)/c.scrollHeight));
        c.style.zoom=z;
        pass++;
      }
    });
  }

  function setLvl(n){
    lvl=Math.min(7,Math.max(1,n));
    try{localStorage.setItem('dbLvl',String(lvl));}catch(e){}
    fit();
    badge.textContent='Text size '+lvl+' / 7 \u00B7 '+PCT[lvl-1]+'%';
    badge.classList.add('on');
    clearTimeout(badgeT);
    badgeT=setTimeout(function(){badge.classList.remove('on');},1600);
  }

  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k>='1'&&k<='7'){e.preventDefault();setLvl(parseInt(k,10));}
    else if(k==='+'||k==='='){e.preventDefault();setLvl(lvl+1);}
    else if(k==='-'||k==='_'){e.preventDefault();setLvl(lvl-1);}
  });

  function wake(){
    document.body.classList.remove('hidecursor');
    clearTimeout(curT);
    curT=setTimeout(function(){document.body.classList.add('hidecursor');},2500);
  }
  document.addEventListener('mousemove',wake);
  document.addEventListener('mousedown',wake);
  wake();

  window.addEventListener('resize',fit);
  window.addEventListener('load',function(){fit();setTimeout(guard,120);setTimeout(guard,600);});

  document.body.setAttribute('data-lvl',String(lvl));
  fit();
  setTimeout(function(){hint.style.opacity='0';},4000);
})();
</script>
<script>
(function(){
  window.addEventListener('load', function(){
    setTimeout(function(){
      if (document.getElementById('__lf-ctl')) return;
      var pages = [].slice.call(document.querySelectorAll('.page'));
      if (!pages.length) return;
      var i = 0, step = 0;
      var steps = function(p){ return [].slice.call(p.querySelectorAll('.step')); };
      function render(){
        pages.forEach(function(p,k){ p.style.display = k===i ? '' : 'none'; });
        steps(pages[i]).forEach(function(s,k){
          s.style.transition = 'opacity .4s, transform .4s';
          s.style.opacity = k < step ? '1' : '0';
          s.style.transform = k < step ? 'none' : 'translateY(14px)';
        });
      }
      function next(){ var n = steps(pages[i]).length;
        if (step < n) step++; else if (i < pages.length-1){ i++; step = 0; } render(); }
      function prev(){ if (step > 0) step--; else if (i > 0){ i--; step = steps(pages[i]).length; } render(); }
      document.addEventListener('keydown', function(e){
        if (e.key === 'ArrowRight' || e.key === ' ') next();
        else if (e.key === 'ArrowLeft') prev();
      });
      document.addEventListener('click', function(e){ if (!e.target.closest('.clickable')) next(); });
      render();
    }, 250);
  });
})();
</script>

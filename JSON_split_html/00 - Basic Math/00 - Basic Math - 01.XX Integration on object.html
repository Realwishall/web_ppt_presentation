/* ---------- shared 3D helpers ---------- */
function stdLights(scene){
  scene.add(new THREE.AmbientLight(0xbfe8d8,.55));
  const key=new THREE.DirectionalLight(0xfff2d8,1.15); key.position.set(3,4,5); scene.add(key);
  const rim=new THREE.DirectionalLight(0x67e0c2,.5); rim.position.set(-4,-2,-3); scene.add(rim);
}
function labelFactory(mount){
  const list=[];
  const make=(html,big)=>{const d=el('div','lbl3'+(big?' big':''),html);mount.appendChild(d);
    const item={el:d,pos:new THREE.Vector3(),op:1};list.push(item);return item;};
  const update=camera=>{const w=mount.clientWidth,h=mount.clientHeight;
    list.forEach(L=>{const v=L.pos.clone().project(camera);
      L.el.style.transform=`translate(-50%,-50%) translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px)`;
      L.el.style.opacity=(v.z<1?L.op:0);});};
  return {make,update};
}
function setPts(line,a,b){line.geometry.setFromPoints([a,b]);
  if(line.material.isLineDashedMaterial)line.computeLineDistances();}
function swapGeo(mesh,geo){mesh.geometry.dispose();mesh.geometry=geo;}

/* ---------- MODULE 08 — HOLLOW SPHERE (latitude band, dA = 2πR sinθ · R dθ) ---------- */
function hshellFactory(ctx){
  const stage=threeStage(mount);
  if(!stage){mount.appendChild(el('div','queuedCard','<p class="qNote">WebGL unavailable — 3D module cannot start.</p>'));return {};}
  const {scene,camera,controls}=stage; stdLights(scene);
  controls.target.set(0,0,0);

  /* hollow shell body */
  const shellMat=new THREE.MeshPhongMaterial({color:0x8fe3cc,transparent:true,opacity:.13,
    side:THREE.DoubleSide,depthWrite:false,shininess:70});
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1,72,48),shellMat));
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.001,28,18),
    new THREE.MeshBasicMaterial({color:0x67e0c2,wireframe:true,transparent:true,opacity:.06})));

  /* axis + meridian guides */
  const dash=c=>new THREE.LineDashedMaterial({color:c,dashSize:.07,gapSize:.05,transparent:true,opacity:.5});
  const axis=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(0,-1.25,0),new THREE.Vector3(0,1.25,0)]),dash(0xf4f1e4));
  axis.computeLineDistances(); scene.add(axis);

  const ghostGroup=new THREE.Group(); scene.add(ghostGroup);
  const peelGroup=new THREE.Group(); scene.add(peelGroup);

  /* element: spherical zone between θ and θ+dθ */
  const bandMat=new THREE.MeshPhongMaterial({color:0xffb84d,emissive:0x6b420c,
    transparent:true,opacity:.95,side:THREE.DoubleSide,shininess:50});
  const band=new THREE.Mesh(new THREE.SphereGeometry(1,72,8,0,Math.PI*2,0,.2),bandMat);
  peelGroup.add(band);

  /* unrolled ribbon shown when pulled */
  const ribMat=new THREE.MeshBasicMaterial({color:0xffb84d,transparent:true,opacity:0,
    side:THREE.DoubleSide});
  const ribbon=new THREE.Mesh(new THREE.PlaneGeometry(1,1),ribMat); peelGroup.add(ribbon);

  /* guides: radius, θ arc, ring radius, dθ gauge */
  const mkLine=(c,dashed)=>{const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(),new THREE.Vector3()]),
    dashed?dash(c):new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.85}));
    if(dashed)l.computeLineDistances(); scene.add(l); return l;};
  const radLine=mkLine(0xf4f1e4), thArc=mkLine(0xf4f1e4), ringRad=mkLine(0x8ecbff),
    dthGauge=mkLine(0xff8a70), conn=mkLine(0xf4f1e4,true);
  conn.material.opacity=.55;

  const LF=labelFactory(mount);
  const labTh=LF.make('θ'), labR=LF.make('R'), labRsin=LF.make('R sinθ'),
    labDth=LF.make('R dθ'), labBand=LF.make('dA = 2πR sinθ · R dθ',true);

  const st={s:.4,N:24,ghosts:true,pull:false};
  const dth=()=>Math.PI/st.N;
  const px={x:0}; // peel offset tracker

  function circleAt(th,color,op){
    const pts=[]; for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;
      pts.push(new THREE.Vector3(Math.sin(th)*Math.cos(a),Math.cos(th),Math.sin(th)*Math.sin(a)));}
    return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color,transparent:true,opacity:op}));
  }
  function buildGhosts(){
    ghostGroup.children.forEach(c=>{c.geometry.dispose();c.material.dispose();});
    ghostGroup.clear();
    for(let i=1;i<st.N;i++)ghostGroup.add(circleAt(i*Math.PI/st.N,0x67e0c2,.28));
  }
  function arcGeo(r,th1,th2){const pts=[];
    for(let i=0;i<=40;i++){const t=th1+(th2-th1)*i/40;
      pts.push(new THREE.Vector3(r*Math.sin(t),r*Math.cos(t),0));}
    return new THREE.BufferGeometry().setFromPoints(pts);}
  function applyAll(){
    const d=dth(), thE=st.s*(Math.PI-d), thM=thE+d/2;
    swapGeo(band,new THREE.SphereGeometry(1.001,72,8,0,Math.PI*2,thE,d));
    /* guides in the z=0 meridian plane */
    const dir=new THREE.Vector3(Math.sin(thM),Math.cos(thM),0);
    setPts(radLine,new THREE.Vector3(),dir.clone().multiplyScalar(1));
    swapGeo(thArc,arcGeo(.36,0,thM));
    setPts(ringRad,new THREE.Vector3(0,Math.cos(thM),0),
      new THREE.Vector3(Math.sin(thM),Math.cos(thM),0));
    swapGeo(dthGauge,arcGeo(1.06,thE,thE+d));
    /* unrolled ribbon: 2πR sinθ × R dθ (scale k) */
    const k=.3, w=2*Math.PI*Math.sin(thM)*k, h=d*k;
    swapGeo(ribbon,new THREE.PlaneGeometry(Math.max(w,.01),Math.max(h,.01)));
    ribbon.position.set(1.42+w/2,Math.cos(thM),0);
    /* labels */
    labTh.pos.set(.3*Math.sin(thM/2)+.1,.3*Math.cos(thM/2),0);
    labR.pos.copy(dir).multiplyScalar(.55).add(new THREE.Vector3(.09,0,0));
    labRsin.pos.set(Math.sin(thM)/2,Math.cos(thM)+.09,0);
    labDth.pos.copy(dir).multiplyScalar(1.16);
    labBand.pos.set(px.x,Math.cos(thM)+ (st.pull?.42:.3),0);
    setPts(conn,new THREE.Vector3(Math.sin(thM)*1.03,Math.cos(thM),0),
      new THREE.Vector3(px.x+Math.sin(thM)-.05,Math.cos(thM),0));
    conn.visible=st.pull&&px.x>.25;
    const sinT=Math.sin(thM);
    ctx.readout([
      ['band centre θ', `${(thM*180/Math.PI).toFixed(1)}° = ${thM.toFixed(3)} rad`],
      ['width R dθ', `πR/${st.N} ≈ ${(Math.PI/st.N).toFixed(3)} R`],
      ['ring length 2πR sinθ', (2*Math.PI*sinT).toFixed(3)+' R'],
      ['element dA', (2*Math.PI*sinT*Math.PI/st.N).toFixed(3)+' R²'],
      ['area check','∫ dA = 4πR²']]);
  }
  buildGhosts(); applyAll();

  ctx.caption('fig. 11 — hollow sphere · element: latitude band  (drag to orbit)');
  ctx.legend([{c:'rgba(143,227,204,.6)',t:'body (shell)'},{c:'var(--amber)',t:'element band'},
    {c:'rgba(103,224,194,.5)',t:'ghost bands'},{c:'var(--sky)',t:'ring radius R sinθ'}]);

  stage.start(t=>{
    bandMat.emissiveIntensity=.6+.3*Math.sin(t*2.4);
    if(st.pull)band.rotation.y=t*.35;
    LF.update(camera);
  });

  const sPos=makeSlider(controlsBar,{label:'angle θ',min:0,max:1,step:.001,value:st.s,
    fmt:v=>(v*(Math.PI-Math.PI/st.N)).toFixed(2)+' rad', onInput:v=>{st.s=v;applyAll();}});
  makeSlider(controlsBar,{label:'bands N',min:6,max:24,step:1,value:st.N,
    fmt:v=>'N = '+v, onInput:v=>{st.N=v;buildGhosts();applyAll();}});
  makeToggle(controlsBar,{label:'ghost bands',value:true,onInput:v=>{st.ghosts=v;ghostGroup.visible=v;}});
  makeToggle(controlsBar,{label:'pull band + unroll',value:false,onInput:v=>{
    st.pull=v; labBand.op=v?1:0;
    gsap.killTweensOf(px); gsap.killTweensOf(peelGroup.position); gsap.killTweensOf(ribMat);
    gsap.to(peelGroup.position,{x:v?1.85:0,duration:1,ease:'power3.inOut',
      onUpdate:()=>{px.x=peelGroup.position.x;applyAll();}});
    gsap.to(ribMat,{opacity:v?.85:0,duration:.8,delay:v?.35:0});}});
  ctx.sweepDur=5;
  ctx.setSweep(t=>{st.s=t;sPos.set(t);applyAll();});
  return {dispose(){gsap.killTweensOf(peelGroup.position);gsap.killTweensOf(ribMat);stopSweep();stage.dispose();}};
}

/* ---------- MODULE 09 — SOLID CONE (disc element, dV = π r(y)² dy, y from apex) ---------- */
function coneFactory(ctx){
  const stage=threeStage(mount);
  if(!stage){mount.appendChild(el('div','queuedCard','<p class="qNote">WebGL unavailable — 3D module cannot start.</p>'));return {};}
  const {scene,camera,controls}=stage; stdLights(scene);
  const H=1.5;                                    /* base radius R=1, height h=1.5 */
  controls.target.set(0,.6,0); camera.position.set(2.9,2.0,3.3);

  /* translucent cone body (apex up at y=H, base at y=0) */
  const bodyMat=new THREE.MeshPhongMaterial({color:0x8fe3cc,transparent:true,opacity:.12,
    side:THREE.DoubleSide,depthWrite:false,shininess:70});
  const body=new THREE.Mesh(new THREE.ConeGeometry(1,H,72,1),bodyMat);
  body.position.y=H/2; scene.add(body);
  const baseRing=(()=>{const pts=[];for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;
      pts.push(new THREE.Vector3(Math.cos(a),0,Math.sin(a)));}
    const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:0x67e0c2,transparent:true,opacity:.5}));
    scene.add(l);return l;})();

  const dashM=new THREE.LineDashedMaterial({color:0xf4f1e4,dashSize:.07,gapSize:.05,transparent:true,opacity:.5});
  const axis=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(0,-.12,0),new THREE.Vector3(0,H+.3,0)]),dashM);
  axis.computeLineDistances(); scene.add(axis);

  const ghostGroup=new THREE.Group(); scene.add(ghostGroup);

  /* accumulated core: cone from apex down to y */
  const coreMat=new THREE.MeshPhongMaterial({color:0x1d574b,transparent:true,opacity:.5,depthWrite:false,shininess:20});
  const core=new THREE.Mesh(new THREE.ConeGeometry(1,1,48,1),coreMat); scene.add(core);

  /* element disc (unit cylinder, scaled) */
  const peelGroup=new THREE.Group(); scene.add(peelGroup);
  const discMat=new THREE.MeshPhongMaterial({color:0xffb84d,emissive:0x6b420c,
    transparent:true,opacity:.95,side:THREE.DoubleSide,shininess:50});
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,56),discMat); peelGroup.add(disc);

  const mkLine=(c,dashed)=>{const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(),new THREE.Vector3()]),
      dashed?new THREE.LineDashedMaterial({color:c,dashSize:.07,gapSize:.05,transparent:true,opacity:.55})
             :new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.85}));
    if(dashed)l.computeLineDistances(); scene.add(l); return l;};
  const radLine=mkLine(0xf4f1e4), dyGauge=mkLine(0xff8a70), conn=mkLine(0xf4f1e4,true);

  const LF=labelFactory(mount);
  const labY=LF.make('y (from apex)'), labR=LF.make('r(y) = R·y/h'), labDy=LF.make('dy'),
    labDisc=LF.make('dV = π r(y)² dy',true);

  const st={s:.45,N:16,ghosts:true,pull:false};
  const dy=()=>H/st.N;

  function buildGhosts(){
    ghostGroup.children.forEach(c=>{c.geometry.dispose();c.material.dispose();});
    ghostGroup.clear();
    for(let i=1;i<st.N;i++){const yi=i*dy(), ri=yi/H, pts=[];
      for(let k=0;k<=72;k++){const a=k/72*Math.PI*2;
        pts.push(new THREE.Vector3(ri*Math.cos(a),H-yi,ri*Math.sin(a)));}
      ghostGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:0x67e0c2,transparent:true,opacity:.3})));}
  }
  function applyAll(){
    const d=dy(), yS=Math.min(st.s*(H-d),H-d), r=yS/H, yc=H-yS-d/2;
    disc.scale.set(r,d,r); disc.position.y=yc;
    core.scale.set(r,Math.max(yS,.001),r); core.position.y=H-yS/2;
    setPts(radLine,new THREE.Vector3(0,yc,0),new THREE.Vector3(r,yc,0));
    setPts(dyGauge,new THREE.Vector3(r+.09,H-yS,0),new THREE.Vector3(r+.09,H-yS-d,0));
    const pxv=peelGroup.position.x;
    setPts(conn,new THREE.Vector3(r+.04,yc,0),new THREE.Vector3(pxv-r-.05,yc,0));
    conn.visible=st.pull&&pxv>.25;
    labY.pos.set(.02,H-yS+.12,0);
    labR.pos.set(r*.55,yc+.09,0);
    labDy.pos.set(r+.2,yc,0);
    labDisc.pos.set(pxv,yc+r*.6+.22,0);
    const yu=yS/H, dV=Math.PI*yu*yu/st.N;
    ctx.readout([
      ['disc position y', yu.toFixed(2)+' h (from apex)'],
      ['thickness dy', `h/${st.N} ≈ ${(1/st.N).toFixed(3)} h`],
      ['disc radius r(y)', `R·y/h ≈ ${yu.toFixed(3)} R`],
      ['element dV', `π r² dy ≈ ${dV.toFixed(3)} R²h`],
      ['volume check','∫ dV = ⅓ πR²h']]);
  }
  buildGhosts(); applyAll();

  ctx.caption('fig. 12 — solid cone · element: thin disc  (drag to orbit)');
  ctx.legend([{c:'rgba(143,227,204,.6)',t:'body'},{c:'var(--amber)',t:'element disc'},
    {c:'var(--chalk)',t:'∫ done (core)'},{c:'rgba(103,224,194,.5)',t:'ghost discs'}]);

  stage.start(t=>{
    discMat.emissiveIntensity=.6+.3*Math.sin(t*2.4);
    if(st.pull)disc.rotation.y=t*.4;
    LF.update(camera);
  });

  const sPos=makeSlider(controlsBar,{label:'height y',min:0,max:1,step:.001,value:st.s,
    fmt:v=>(v*(1-1/st.N)).toFixed(2)+' h', onInput:v=>{st.s=v;applyAll();}});
  makeSlider(controlsBar,{label:'discs N',min:4,max:16,step:1,value:st.N,
    fmt:v=>'N = '+v, onInput:v=>{st.N=v;buildGhosts();applyAll();}});
  makeToggle(controlsBar,{label:'ghost discs',value:true,onInput:v=>{st.ghosts=v;ghostGroup.visible=v;}});
  makeToggle(controlsBar,{label:'pull disc out',value:false,onInput:v=>{
    st.pull=v; labDisc.op=v?1:0;
    gsap.killTweensOf(peelGroup.position);
    gsap.to(peelGroup.position,{x:v?1.7:0,duration:1,ease:'power3.inOut',onUpdate:applyAll});}});
  ctx.sweepDur=5;
  ctx.setSweep(t=>{st.s=t;sPos.set(t);applyAll();});
  return {dispose(){gsap.killTweensOf(peelGroup.position);stopSweep();stage.dispose();}};
}

/* ---------- MODULE 10 — HOLLOW CONE (slant ring, dA = 2πr dℓ) ---------- */
function conehFactory(ctx){
  const stage=threeStage(mount);
  if(!stage){mount.appendChild(el('div','queuedCard','<p class="qNote">WebGL unavailable — 3D module cannot start.</p>'));return {};}
  const {scene,camera,controls}=stage; stdLights(scene);
  const H=1.5, R=1, L=Math.hypot(R,H);            /* slant length ℓ */
  const cosA=H/L, sinA=R/L, phiG=.85;             /* generator facing the camera */
  controls.target.set(0,.6,0); camera.position.set(2.9,2.0,3.3);

  /* open conical surface */
  const bodyMat=new THREE.MeshPhongMaterial({color:0x8fe3cc,transparent:true,opacity:.14,
    side:THREE.DoubleSide,depthWrite:false,shininess:70});
  const body=new THREE.Mesh(new THREE.ConeGeometry(R,H,72,1,true),bodyMat);
  body.position.y=H/2; scene.add(body);
  const baseRing=(()=>{const pts=[];for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;
      pts.push(new THREE.Vector3(R*Math.cos(a),0,R*Math.sin(a)));}
    const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:0x67e0c2,transparent:true,opacity:.5}));
    scene.add(l);return l;})();

  /* generator line (the slant we integrate along) */
  const G=s=>new THREE.Vector3(R*(s/L)*Math.cos(phiG),H-s*cosA,R*(s/L)*Math.sin(phiG));
  const gen=new THREE.Line(new THREE.BufferGeometry().setFromPoints([G(0),G(L)]),
    new THREE.LineBasicMaterial({color:0xf4f1e4,transparent:true,opacity:.7}));
  scene.add(gen);

  const ghostGroup=new THREE.Group(); scene.add(ghostGroup);
  const peelGroup=new THREE.Group(); scene.add(peelGroup);

  /* element: conical band between slant s and s+dℓ */
  const bandMat=new THREE.MeshPhongMaterial({color:0xffb84d,emissive:0x6b420c,
    transparent:true,opacity:.95,side:THREE.DoubleSide,shininess:50});
  const band=new THREE.Mesh(new THREE.CylinderGeometry(.5,.6,.2,64,1,true),bandMat);
  peelGroup.add(band);

  const mkLine=c=>{const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(),new THREE.Vector3()]),
      new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.85}));
    scene.add(l); return l;};
  const legDr=mkLine(0xff8a70), legDy=mkLine(0xff8a70);
  legDr.material.dasharray=null; legDr.material.opacity=.8; legDy.material.opacity=.8;
  const conn=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),
    new THREE.LineDashedMaterial({color:0xf4f1e4,dashSize:.07,gapSize:.05,transparent:true,opacity:.55}));
  conn.computeLineDistances(); scene.add(conn);

  const LF=labelFactory(mount);
  const labL=LF.make('ℓ (slant)'), labR=LF.make('r'), labDr=LF.make('dr'),
    labDy=LF.make('dy'), labDl=LF.make('dℓ'), labBand=LF.make('dA = 2πr · dℓ',true);

  const st={s:.42,N:20,ghosts:true,tri:true,pull:false};
  const dl=()=>L/st.N;

  function buildGhosts(){
    ghostGroup.children.forEach(c=>{c.geometry.dispose();c.material.dispose();});
    ghostGroup.clear();
    for(let i=1;i<st.N;i++){const si=i*dl(), ri=R*si/L, pts=[];
      for(let k=0;k<=72;k++){const a=k/72*Math.PI*2;
        pts.push(new THREE.Vector3(ri*Math.cos(a),H-si*cosA,ri*Math.sin(a)));}
      ghostGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:0x67e0c2,transparent:true,opacity:.3})));}
  }
  function applyAll(){
    const d=dl(), s1=st.s*(L-d), s2=s1+d, sc=s1+d/2;
    const r1=R*s1/L, r2=R*s2/L, rc=R*sc/L;
    swapGeo(band,new THREE.CylinderGeometry(r1,r2,d*cosA,64,1,true));
    band.position.y=H-sc*cosA;
    /* dr–dy–dℓ triangle on the wall at the element */
    const Pc=G(sc), Pe=G(s2),
      Ph=new THREE.Vector3(R*(s2/L)*Math.cos(phiG),Pc.y,R*(s2/L)*Math.sin(phiG));
    setPts(legDr,Pc,Ph); setPts(legDy,Ph,Pe);
    const vis=st.tri?1:0; legDr.visible=!!vis; legDy.visible=!!vis;
    labDr.pos.copy(Pc).lerp(Ph,.5).add(new THREE.Vector3(.05,.07,0));
    labDy.pos.copy(Ph).lerp(Pe,.5).add(new THREE.Vector3(.14,0,0));
    labDl.pos.copy(Pc).lerp(Pe,.5).add(new THREE.Vector3(-.02,.1,0));
    const pxv=peelGroup.position.x;
    setPts(conn,Pc.clone().add(new THREE.Vector3(.05,0,0)),

function cartFactory(ctx){

  const {scene,camera,controls}=stage; stdLights(scene);
  const A=1.6,B=1.15,C=1.05;                    /* region a×b×c, corner at origin */
  controls.target.set(A/2,B/2,C/2); camera.position.set(3.1,2.2,3.6);

  /* region box */
  const box=new THREE.Mesh(new THREE.BoxGeometry(A,B,C),
    new THREE.MeshPhongMaterial({color:0x8fe3cc,transparent:true,opacity:.08,
      side:THREE.DoubleSide,depthWrite:false}));
  box.position.set(A/2,B/2,C/2); scene.add(box);
  const frame=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(A,B,C)),
    new THREE.LineBasicMaterial({color:0x67e0c2,transparent:true,opacity:.5}));
  frame.position.copy(box.position); scene.add(frame);

  /* axes from the origin corner */
  const ax=(to,lab)=>{const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(),to]),new THREE.LineBasicMaterial({color:0xf4f1e4,transparent:true,opacity:.6}));
    scene.add(l);return l;};
  ax(new THREE.Vector3(A+.35,0,0)); ax(new THREE.Vector3(0,B+.35,0)); ax(new THREE.Vector3(0,0,C+.35));

  /* subdivision grid (all three directions) */
  const ghostGroup=new THREE.Group(); scene.add(ghostGroup);
  function buildGhosts(){
    ghostGroup.children.forEach(c=>{c.geometry.dispose();c.material.dispose();});ghostGroup.clear();
    const pts=[],N=st.N;
    for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){
      const y=B*i/N,z=C*j/N,x=A*i/N;
      pts.push(0,y,z, A,y,z);                    /* x-lines */
      pts.push(x,0,z, x,B,z);                    /* y-lines */
      pts.push(x,y,0, x,y,C);}                   /* z-lines */
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
    ghostGroup.add(new THREE.LineSegments(g,
      new THREE.LineBasicMaterial({color:0x67e0c2,transparent:true,opacity:.14})));

  /* element brick */
  const peelGroup=new THREE.Group(); scene.add(peelGroup);
  const brickMat=new THREE.MeshPhongMaterial({color:0xffb84d,emissive:0x6b420c,
    transparent:true,opacity:.85,shininess:50});
  const brick=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),brickMat); peelGroup.add(brick);
  const brickEdge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),
    new THREE.LineBasicMaterial({color:0xffd99a,transparent:true,opacity:.95}));
  peelGroup.add(brickEdge);
  const conn=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),
    new THREE.LineDashedMaterial({color:0xf4f1e4,dashSize:.07,gapSize:.05,transparent:true,opacity:.55}));
  conn.computeLineDistances(); scene.add(conn);

  const LF=labelFactory(mount);
  const labX=LF.make('x'),labY=LF.make('y'),labZ=LF.make('z'),
    labDx=LF.make('dx'),labDy=LF.make('dy'),labDz=LF.make('dz'),
    labBrick=LF.make('dV = dx·dy·dz',true);

  const st={x:.4,y:.4,z:.4,N:10,ghosts:true,pull:false};
  const PULL=new THREE.Vector3(.9,.55,.75).normalize().multiplyScalar(1.35);

  function applyAll(){
    const dx=A/st.N,dy=B/st.N,dz=C/st.N;
    const bx=st.x*(A-dx),by=st.y*(B-dy),bz=st.z*(C-dz);
    brick.scale.set(dx,dy,dz); brickEdge.scale.set(dx,dy,dz);
    const home=new THREE.Vector3(bx+dx/2,by+dy/2,bz+dz/2);
    brick.position.copy(home); brickEdge.position.copy(home);
    setPts(conn,home,home.clone().add(peelGroup.position));
    conn.visible=st.pull&&peelGroup.position.length()>.2;
    labX.pos.set(A+.48,0,0); labY.pos.set(0,B+.48,0); labZ.pos.set(0,0,C+.48);
    labDx.pos.set(bx+dx/2,by-.09,bz+dz+.06);
    labDy.pos.set(bx-.09,by+dy/2,bz+dz+.06);
    labDz.pos.set(bx+dx+.09,by-.06,bz+dz/2);
    labBrick.pos.copy(home).add(peelGroup.position).add(new THREE.Vector3(0,dy/2+.24,0));
    ctx.readout([
      ['brick position', `(${st.x.toFixed(2)}a, ${st.y.toFixed(2)}b, ${st.z.toFixed(2)}c)`],
      ['edges', `dx=a/${st.N}, dy=b/${st.N}, dz=c/${st.N}`],
      ['element dV', `abc/${st.N**3} ≈ ${(1/st.N**3).toFixed(4)} abc`],
      ['volume check','∭ dx dy dz = abc']]);
  }
  buildGhosts(); applyAll();

  ctx.caption('fig. 14 — cartesian region · element: brick dx dy dz  (drag to orbit)');
  ctx.legend([{c:'rgba(143,227,204,.6)',t:'region'},{c:'var(--amber)',t:'element brick'},
    {c:'rgba(103,224,194,.4)',t:'partition grid'}]);

  stage.start(t=>{brickMat.emissiveIntensity=.6+.3*Math.sin(t*2.4);LF.update(camera);});

  const sx=makeSlider(controlsBar,{label:'slice x',min:0,max:1,step:.001,value:st.x,
    fmt:v=>(v*(1-1/st.N)).toFixed(2)+' a', onInput:v=>{st.x=v;applyAll();}});
  const sy=makeSlider(controlsBar,{label:'slice y',min:0,max:1,step:.001,value:st.y,
    fmt:v=>(v*(1-1/st.N)).toFixed(2)+' b', onInput:v=>{st.y=v;applyAll();}});
  const sz=makeSlider(controlsBar,{label:'slice z',min:0,max:1,step:.001,value:st.z,
    fmt:v=>(v*(1-1/st.N)).toFixed(2)+' c', onInput:v=>{st.z=v;applyAll();}});
  makeSlider(controlsBar,{label:'cuts N',min:3,max:10,step:1,value:st.N,
    fmt:v=>'N = '+v, onInput:v=>{st.N=v;buildGhosts();applyAll();}});
  makeToggle(controlsBar,{label:'partition grid',value:true,onInput:v=>{st.ghosts=v;ghostGroup.visible=v;}});
  makeToggle(controlsBar,{label:'pull brick out',value:false,onInput:v=>{
    st.pull=v; labBrick.op=v?1:0;
    gsap.killTweensOf(peelGroup.position);
    gsap.to(peelGroup.position,{x:v?PULL.x:0,y:v?PULL.y:0,z:v?PULL.z:0,
      duration:1,ease:'power3.inOut',onUpdate:applyAll});}});
  ctx.sweepDur=5;
  ctx.setSweep(t=>{st.x=st.y=st.z=t;sx.set(t);sy.set(t);sz.set(t);applyAll();});
  return {dispose(){gsap.killTweensOf(peelGroup.position);stopSweep();stage.dispose();}};
}

/* ---------- shared: annular wedge geometry for module 12 ---------- */
function wedgeGeo(r1,r2,t1,t2,z1,z2,seg=6){
  const pos=[],P=(r,t,z)=>[r*Math.cos(t),z,r*Math.sin(t)];
  const quad=(a,b,c,d)=>pos.push(...a,...b,...c,...a,...c,...d);
  for(let i=0;i<seg;i++)for(let j=0;j<seg;j++){
    const ra=r1+(r2-r1)*i/seg, rb=r1+(r2-r1)*(i+1)/seg;
    const ta=t1+(t2-t1)*j/seg, tb=t1+(t2-t1)*(j+1)/seg;
    quad(P(ra,ta,z2),P(rb,ta,z2),P(rb,tb,z2),P(ra,tb,z2));   /* top */
    quad(P(ra,ta,z1),P(ra,tb,z1),P(rb,tb,z1),P(rb,ta,z1));}  /* bottom */
  for(let j=0;j<seg;j++){
    const ta=t1+(t2-t1)*j/seg, tb=t1+(t2-t1)*(j+1)/seg;
    quad(P(r1,ta,z1),P(r1,ta,z2),P(r1,tb,z2),P(r1,tb,z1));   /* inner */
    quad(P(r2,ta,z1),P(r2,tb,z1),P(r2,tb,z2),P(r2,ta,z2));}  /* outer */
  for(let i=0;i<seg;i++){
    const ra=r1+(r2-r1)*i/seg, rb=r1+(r2-r1)*(i+1)/seg;
    quad(P(ra,t1,z1),P(ra,t1,z2),P(rb,t1,z2),P(rb,t1,z1));   /* side 1 */
    quad(P(ra,t2,z1),P(rb,t2,z1),P(rb,t2,z2),P(ra,t2,z2));}  /* side 2 */
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals(); return g;
}

function cylFactory(ctx){
  const stage=threeStage(mount);
  if(!stage){mount.appendChild(el('div','queuedCard','<p class="qNote">WebGL unavailable — 3D module cannot start.</p>'));return {};}
  const {scene,camera,controls}=stage; stdLights(scene);
  const H=1.4;                                   /* radius R=1, height h */
  controls.target.set(0,H/2,0); camera.position.set(3.0,2.1,3.4);

  const body=new THREE.Mesh(new THREE.CylinderGeometry(1,1,H,72,1,false),
    new THREE.MeshPhongMaterial({color:0x8fe3cc,transparent:true,opacity:.10,
      side:THREE.DoubleSide,depthWrite:false}));
  body.position.y=H/2; scene.add(body);
  const dash=c=>new THREE.LineDashedMaterial({color:c,dashSize:.07,gapSize:.05,transparent:true,opacity:.5});
  const axis=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(0,-.15,0),new THREE.Vector3(0,H+.3,0)]),dash(0xf4f1e4));
  axis.computeLineDistances(); scene.add(axis);

  const ghostGroup=new THREE.Group(); scene.add(ghostGroup);
  const circleAt=(y,r,op)=>{const pts=[];for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;
      pts.push(new THREE.Vector3(r*Math.cos(a),y,r*Math.sin(a)));}
    return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({color:0x67e0c2,transparent:true,opacity:op}));};

  const elGroup=new THREE.Group(); scene.add(elGroup);
  const wedgeMat=new THREE.MeshPhongMaterial({color:0xffb84d,emissive:0x6b420c,
    transparent:true,opacity:.92,side:THREE.DoubleSide,shininess:40});
  const wedge=new THREE.Mesh(new THREE.BufferGeometry(),wedgeMat); elGroup.add(wedge);

  const mkLine=c=>{const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(),new THREE.Vector3()]),
      new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.9}));
    elGroup.add(l);return l;};
  const arcPts=(r,t1,t2,y,n=24)=>{const p=[];for(let i=0;i<=n;i++)
      p.push(new THREE.Vector3(r*Math.cos(t1+(t2-t1)*i/n),y,r*Math.sin(t1+(t2-t1)*i/n)));return p;};
  const drLine=mkLine(0xf4f1e4), dzLine=mkLine(0xf4f1e4),
    arcRdth=mkLine(0xff8a70), arcDth=mkLine(0x8ecbff);
  const conn=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),
    dash(0xf4f1e4)); scene.add(conn);

  const LF=labelFactory(mount);
  const labDr=LF.make('dr'),labDz=LF.make('dz'),labRdth=LF.make('r dθ'),
    labDth=LF.make('dθ'),labR=LF.make('r'),labWedge=LF.make('dV = r dr dθ dz',true);

  const st={r:.5,th:.3,z:.45,N:14,ghosts:true,pull:false};
  const dims=()=>({dr:1/st.N,dth:2*Math.PI/st.N,dz:H/st.N});

  function buildGhosts(){
    ghostGroup.children.forEach(c=>{c.geometry.dispose();c.material.dispose();});ghostGroup.clear();
    for(let i=1;i<st.N;i++){ghostGroup.add(circleAt(H,i/st.N,.3));
      ghostGroup.add(circleAt(0,i/st.N,.3));}
    for(let j=1;j<st.N;j++)ghostGroup.add(circleAt(H*j/st.N,1,.18));
  }
  function applyAll(){
    const {dr,dth,dz}=dims();
    const r1=st.r*(1-dr), r2=r1+dr;
    const t1=st.th*(Math.PI*2-dth), t2=t1+dth, tm=(t1+t2)/2;
    const z1=st.z*(H-dz), z2=z1+dz;
    swapGeo(wedge,wedgeGeo(r1,r2,t1,t2,z1,z2));
    /* guides (local to elGroup so they travel when pulled) */
    setPts(drLine,new THREE.Vector3(r1*Math.cos(t2),z2,r1*Math.sin(t2)),
      new THREE.Vector3(r2*Math.cos(t2),z2,r2*Math.sin(t2)));
    setPts(dzLine,new THREE.Vector3(r2*Math.cos(t2),z1,r2*Math.sin(t2)),
      new THREE.Vector3(r2*Math.cos(t2),z2,r2*Math.sin(t2)));
    arcRdth.geometry.setFromPoints(arcPts(r2+.04,t1,t2,z2+.04));
    arcDth.geometry.setFromPoints(arcPts(.2,t1,t2,z2+.05));
    const off=elGroup.position, add=p=>p.clone().add(off);
    setPts(conn,new THREE.Vector3((r1+r2)/2*Math.cos(tm),(z1+z2)/2,(r1+r2)/2*Math.sin(tm)),
      add(new THREE.Vector3((r1+r2)/2*Math.cos(tm)- .05,(z1+z2)/2,(r1+r2)/2*Math.sin(tm))));
    conn.visible=st.pull&&off.length()>.2;
    labDr.pos.copy(add(new THREE.Vector3((r1+r2)/2*Math.cos(t2),z2+.09,r1*Math.sin(t2)+ (r2-r1)*Math.sin(t2)/2)));
    labDz.pos.copy(add(new THREE.Vector3(r2*Math.cos(t2)+.1,(z1+z2)/2,r2*Math.sin(t2)+.1)));
    labRdth.pos.copy(add(new THREE.Vector3((r2+.16)*Math.cos(tm),z2+.13,(r2+.16)*Math.sin(tm))));
    labDth.pos.copy(add(new THREE.Vector3(.32*Math.cos(tm),z2+.14,.32*Math.sin(tm))));
    labR.pos.copy(add(new THREE.Vector3(r1*.55*Math.cos(t1+.02),z2+.08,r1*.55*Math.sin(t1+.02))));
    labWedge.pos.copy(add(new THREE.Vector3(r2*Math.cos(tm),z2+.4,r2*Math.sin(tm))));
    const ru=(r1+r2)/2, dV=2*Math.PI*ru/st.N**3;
    ctx.readout([
      ['position', `r=${ru.toFixed(2)}R · θ=${tm.toFixed(2)} · z=${(z1/H).toFixed(2)}h`],
      ['edge dr', `R/${st.N} ≈ ${dr.toFixed(3)} R`],
      ['edge r·dθ', `${(ru*dth).toFixed(3)} R   (dθ = ${dth.toFixed(3)} rad)`],
      ['edge dz', `h/${st.N} ≈ ${(dz/H).toFixed(3)} h`],
      ['element dV', `r dr dθ dz ≈ ${dV.toFixed(4)} R²h`],
      ['volume check','∭ r dr dθ dz = πR²h']]);
  }
  buildGhosts(); applyAll();

  ctx.caption('fig. 15 — cylinder · element: curved wedge  (drag to orbit)');
  ctx.legend([{c:'rgba(143,227,204,.6)',t:'region'},{c:'var(--amber)',t:'element wedge'},
    {c:'var(--coral)',t:'arc edge r·dθ'},{c:'var(--sky)',t:'angle dθ'}]);

  stage.start(t=>{wedgeMat.emissiveIntensity=.6+.3*Math.sin(t*2.4);LF.update(camera);});

  makeSlider(controlsBar,{label:'radius r',min:0,max:1,step:.001,value:st.r,
    fmt:v=>(v*(1-1/st.N)).toFixed(2)+' R', onInput:v=>{st.r=v;applyAll();}});
  const sth=makeSlider(controlsBar,{label:'angle θ',min:0,max:1,step:.001,value:st.th,
    fmt:v=>(v*(Math.PI*2-2*Math.PI/st.N)).toFixed(2)+' rad', onInput:v=>{st.th=v;applyAll();}});
  makeSlider(controlsBar,{label:'height z',min:0,max:1,step:.001,value:st.z,
    fmt:v=>(v*(1-1/st.N)).toFixed(2)+' h', onInput:v=>{st.z=v;applyAll();}});
  makeSlider(controlsBar,{label:'cuts N',min:4,max:14,step:1,value:st.N,
    fmt:v=>'N = '+v, onInput:v=>{st.N=v;buildGhosts();applyAll();}});
  makeToggle(controlsBar,{label:'ghost partition',value:true,onInput:v=>{st.ghosts=v;ghostGroup.visible=v;}});
  makeToggle(controlsBar,{label:'pull wedge out',value:false,onInput:v=>{
    st.pull=v; labWedge.op=v?1:0;
    const tm=st.th*(Math.PI*2-dims().dth)+dims().dth/2;
    gsap.killTweensOf(elGroup.position);
    gsap.to(elGroup.position,{x:v?Math.cos(tm)*1.5:0,z:v?Math.sin(tm)*1.5:0,y:v?.25:0,
      duration:1,ease:'power3.inOut',onUpdate:applyAll});}});
  ctx.sweepDur=5;
  ctx.setSweep(t=>{st.th=t;sth.set(t);applyAll();});
  return {dispose(){gsap.killTweensOf(elGroup.position);stopSweep();stage.dispose();}};

/* ---------- shared: parametric face geometry for module 13 ---------- */
function paramGeo(fn,nu,nv){
  const pos=[];
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
    const u0=i/nu,u1=(i+1)/nu,v0=j/nv,v1=(j+1)/nv;
    const a=fn(u0,v0),b=fn(u1,v0),c=fn(u1,v1),d=fn(u0,v1);
    pos.push(...a,...b,...c,...a,...c,...d);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals(); return g;
}

/* ---------- MODULE 13 — SPHERICAL VOLUME (cell, dV = r² sinθ dr dθ dφ) ---------- */
function sphvFactory(ctx){
  const stage=threeStage(mount);
  if(!stage){mount.appendChild(el('div','queuedCard','<p class="qNote">WebGL unavailable — 3D module cannot start.</p>'));return {};}

    new THREE.MeshPhongMaterial({color:0x8fe3cc,transparent:true,opacity:.09,

  const dashM=new THREE.LineDashedMaterial({color:0xf4f1e4,dashSize:.07,gapSize:.05,transparent:true,opacity:.5});
  const axis=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(0,-1.25,0),new THREE.Vector3(0,1.25,0)]),dashM);
  axis.computeLineDistances(); scene.add(axis);
  const eq=[];for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;eq.push(new THREE.Vector3(Math.cos(a),0,Math.sin(a)));}
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(eq),
    new THREE.LineBasicMaterial({color:0xf4f1e4,transparent:true,opacity:.18})));

  const ghostGroup=new THREE.Group(); scene.add(ghostGroup);
  const cellGroup=new THREE.Group(); scene.add(cellGroup);
  const cellMat=new THREE.MeshPhongMaterial({color:0xffb84d,emissive:0x6b420c,
    transparent:true,opacity:.92,side:THREE.DoubleSide,shininess:40});

  const S=(r,th,ph)=>[r*Math.sin(th)*Math.cos(ph),r*Math.cos(th),r*Math.sin(th)*Math.sin(ph)];
  const guide=c=>{const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(),new THREE.Vector3()]),
      new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.95}));

  const gDr=guide(0xf4f1e4),gDth=guide(0xff8a70),gDph=guide(0x8ecbff);

  const labDr=LF.make('dr'),labRdth=LF.make('r dθ'),labRsdph=LF.make('r sinθ dφ'),
    labCell=LF.make('dV = r² sinθ dr dθ dφ',true);

  const st={r:.55,th:.45,ph:.3,N:12,ghosts:true,pull:false,p:0};
  const dims=()=>({dr:1/st.N,dth:Math.PI/st.N,dph:2*Math.PI/st.N});

  function buildGhosts(){
    ghostGroup.children.forEach(c=>{c.geometry.dispose();c.material.dispose();});ghostGroup.clear();
    for(let i=1;i<st.N;i++)ghostGroup.add(new THREE.Mesh(new THREE.SphereGeometry(i/st.N,28,16),
      new THREE.MeshBasicMaterial({color:0x67e0c2,wireframe:true,transparent:true,opacity:.05})));
  }
  function buildCell(){
    cellGroup.children.forEach(c=>c.geometry&&c.geometry.dispose());cellGroup.clear();
    const {dr,dth,dph}=dims();
    const r1=st.r*(1-dr),r2=r1+dr,
      t1=st.th*(Math.PI-dth),t2=t1+dth,
      p1=st.ph*(Math.PI*2-dph),p2=p1+dph;
    const faces=[
      [u=>{},(u,v)=>S(r2,t1+(t2-t1)*u,p1+(p2-p1)*v)],               /* outer r2 */
      [u=>{},(u,v)=>S(r1,t1+(t2-t1)*u,p1+(p2-p1)*v)],               /* inner r1 */
      [u=>{},(u,v)=>S(r1+(r2-r1)*u,t2,p1+(p2-p1)*v)],               /* cone θ2 */
      [u=>{},(u,v)=>S(r1+(r2-r1)*u,t1,p1+(p2-p1)*v)],               /* cone θ1 */
      [u=>{},(u,v)=>S(r1+(r2-r1)*u,t1+(t2-t1)*v,p2)],               /* plane φ2 */
      [u=>{},(u,v)=>S(r1+(r2-r1)*u,t1+(t2-t1)*v,p1)]];              /* plane φ1 */
    const tm=(t1+t2)/2,pm=(p1+p2)/2;
    const er=new THREE.Vector3(...S(1,tm,pm)).normalize(),
      eth=new THREE.Vector3(Math.cos(tm)*Math.cos(pm),-Math.sin(tm),Math.cos(tm)*Math.sin(pm)),
      eph=new THREE.Vector3(-Math.sin(pm),0,Math.cos(pm));
    const dirs=[er.clone().multiplyScalar(.26),er.clone().multiplyScalar(-.18),
      eth.clone().multiplyScalar(.2),eth.clone().multiplyScalar(-.2),
      eph.clone().multiplyScalar(.2),eph.clone().multiplyScalar(-.2)];
    faces.forEach((f,i)=>{const m=new THREE.Mesh(paramGeo(f[1],8,8),cellMat);
      m.userData.dir=dirs[i]; cellGroup.add(m);});
    /* edge guides */
    gDr.geometry.setFromPoints([new THREE.Vector3(...S(r1,t2,p2)),new THREE.Vector3(...S(r2,t2,p2))]);
    const a1=[];for(let i=0;i<=24;i++)a1.push(new THREE.Vector3(...S(r2,t1+(t2-t1)*i/24,p2)));
    gDth.geometry.setFromPoints(a1);
    const a2=[];for(let i=0;i<=24;i++)a2.push(new THREE.Vector3(...S(r2,t2,p1+(p2-p1)*i/24)));
    gDph.geometry.setFromPoints(a2);
    labDr.pos.set(...S((r1+r2)/2,t2,p2)).add(new THREE.Vector3(.08,.05,0));
    labRdth.pos.set(...S(r2,tm,p2)).add(new THREE.Vector3(.1,.08,0));
    labRsdph.pos.set(...S(r2,t2,pm)).add(new THREE.Vector3(0,.1,.1));
    labCell.pos.set(...S(r2+.12,tm,pm));
    return {tm,pm};
  }
  let meta=buildCell(); buildGhosts();

  function readout(){
    const {dr,dth,dph}=dims(), ru=st.r*(1-dr)+dr/2,
      tm=meta.tm, dV=2*Math.PI*Math.PI*ru*ru*Math.sin(tm)/st.N**3;
    ctx.readout([
      ['position', `r=${ru.toFixed(2)}R · θ=${tm.toFixed(2)} · φ=${meta.pm.toFixed(2)}`],
      ['edge dr', `${dr.toFixed(3)} R`],
      ['edge r·dθ', `${(ru*dth).toFixed(3)} R`],
      ['edge r sinθ·dφ', `${(ru*Math.sin(tm)*dph).toFixed(3)} R`],
      ['element dV', `≈ ${dV.toFixed(4)} R³`],
      ['volume check','∭ r² sinθ dr dθ dφ = 4⁄3 πR³']]);
  }
  readout();

  ctx.caption('fig. 16 — sphere · element: spherical cell  (drag to orbit)');
  ctx.legend([{c:'rgba(143,227,204,.6)',t:'region'},{c:'var(--amber)',t:'element cell'},
    {c:'var(--coral)',t:'r dθ edge'},{c:'var(--sky)',t:'r sinθ dφ edge'}]);

  stage.start(t=>{
    cellMat.emissiveIntensity=.6+.3*Math.sin(t*2.4);
    cellGroup.children.forEach(m=>m.position.copy(m.userData.dir).multiplyScalar(st.p));
    LF.update(camera);});

  const upd=()=>{meta=buildCell();readout();};
  makeSlider(controlsBar,{label:'radius r',min:0,max:1,step:.001,value:st.r,
    fmt:v=>(v*(1-1/st.N)).toFixed(2)+' R', onInput:v=>{st.r=v;upd();}});
  makeSlider(controlsBar,{label:'polar θ',min:0,max:1,step:.001,value:st.th,
    fmt:v=>(v*(Math.PI-Math.PI/st.N)).toFixed(2)+' rad', onInput:v=>{st.th=v;upd();}});
  const sph=makeSlider(controlsBar,{label:'azimuth φ',min:0,max:1,step:.001,value:st.ph,
    fmt:v=>(v*(Math.PI*2-2*Math.PI/st.N)).toFixed(2)+' rad', onInput:v=>{st.ph=v;upd();}});
  makeSlider(controlsBar,{label:'cuts N',min:4,max:12,step:1,value:st.N,
    fmt:v=>'N = '+v, onInput:v=>{st.N=v;buildGhosts();upd();}});
  makeToggle(controlsBar,{label:'ghost shells',value:true,onInput:v=>{st.ghosts=v;ghostGroup.visible=v;}});
  makeToggle(controlsBar,{label:'explode cell',value:false,onInput:v=>{
    st.pull=v; labCell.op=v?1:0;
    gsap.killTweensOf(st); gsap.to(st,{p:v?1:0,duration:.9,ease:'power3.inOut'});}});
  ctx.sweepDur=5;
  ctx.setSweep(t=>{st.ph=t;sph.set(t);upd();});
  return {dispose(){gsap.killTweensOf(st);stopSweep();stage.dispose();}};
}

/* ============================================================================
   MODULE REGISTRY — all 13 cases. status:'ready' modules get a factory;
   'queued' modules show their maths + plan in a placeholder card.
   ========================================================================== */
const raw=String.raw;
const MODULES=[
 /* ---- 1D / LINEAR ---- */
 {id:'wire',n:'01',group:'1D · LINEAR',title:'Straight Wire',dim:'1D',chip:'element of length',
  elTex:raw`d\ell = dx`, elTexShort:'dℓ = dx', status:'ready', factory:wireFactory,
  info:{why:'When a quantity is spread along a straight line — mass on a wire, charge on a rod — the coordinate x already labels every point. Cut the wire into N pieces of width Δx and let N → ∞: each piece becomes an infinitesimal straight segment dx. There is no curvature to follow, so dx is the whole story.',
    texBlocks:[
      {label:'the element',tex:raw`d\ell = dx`},
      {label:'example: total mass from linear density λ(x)',tex:raw`M=\int_0^L \lambda(x)\,dx`}],
    tip:'Ask the class: what breaks if the wire is bent? dx no longer follows the material — that is exactly why modules 02 and 03 exist. Press ▶ sweep to shower the pieces across the wire.'}},

 {id:'arc',n:'02',group:'1D · LINEAR',title:'Circular Arc',dim:'1D',chip:'element of arc',
  elTex:raw`ds = R\,d\theta`, elTexShort:'ds = R dθ', status:'ready', factory:arcFactory,
  info:{why:'On a circle the radius is frozen — position is pure angle. Stepping the angle by dθ sweeps out a piece of arc whose length is radius × angle: ds = R·dθ. The angle itself becomes the integration variable, and radians make the conversion factor exactly R.',
    texBlocks:[
      {label:'the element',tex:raw`ds = R\,d\theta`},
      {label:'summing every wedge',tex:raw`\ell=\int_{\theta_1}^{\theta_2} R\,d\theta = R(\theta_2-\theta_1)`}],
    tip:'Radians are not optional here — they are precisely what makes arc length equal R·dθ. Pull the element out and ask: which two quantities are fixed for every piece? (R and dθ.)'}},

 {id:'curve',n:'03',group:'1D · LINEAR',title:'Smooth Curve',dim:'1D',chip:'element of arc',
  elTex:raw`d\ell=\sqrt{dx^2+dy^2}=\sqrt{1+\left(\tfrac{dy}{dx}\right)^2}\,dx`, elTexShort:'dℓ = √(dx²+dy²)', status:'ready', factory:curveFactory,
  info:{why:'A bent curve is locally straight: zoom into any point and the tiny piece is the hypotenuse of a right triangle with legs dx and dy. Pythagoras supplies the element, and the slope dy/dx converts it into a single-variable integral.',
    texBlocks:[
      {label:'the element',tex:raw`d\ell=\sqrt{dx^2+dy^2}=\sqrt{1+\left(\tfrac{dy}{dx}\right)^2}\,dx`},
      {label:'total length',tex:raw`\ell=\int_a^b \sqrt{1+\left(\tfrac{dy}{dx}\right)^2}\,dx`}],
    tip:'Leave the ×9 zoom lens on and sweep the curve — at every point the amber piece sits flush with its dashed chord. Raise N and watch the ghost chord-polyline hug the curve: that polygon is literally the Riemann sum before the limit.'}},

 {id:'rect',n:'04',group:'2D · PLANAR',title:'Rectangle / Region',dim:'2D',chip:'strip element',
  elTex:raw`dA = y\,dx \;\;\text{or}\;\; dA = x\,dy`, elTexShort:'dA = y dx', status:'ready', factory:rectFactory,
  info:{why:'Choose strips perpendicular to the axis you integrate along. Each strip has one infinitesimal thickness (dx or dy) and one finite extent fixed by the boundary — here y = b or x = a. Both orientations tile the same region and return the same area: the choice is strategic, not forced.',
    texBlocks:[
      {label:'the element (either orientation)',tex:raw`dA = \underbrace{b}_{y}\,dx \qquad\text{or}\qquad dA = \underbrace{a}_{x}\,dy`},
      {label:'both give the same area',tex:raw`A=\int_0^a b\,dx = ab = \int_0^b a\,dy`}],
    tip:'Flip the orientation switch mid-sweep: same answer, different bookkeeping. Then foreshadow the next lesson — the moment the boundary becomes a curve y(x), the strip height stops being constant and the integral gets interesting.'}},

 {id:'tri',n:'05',group:'2D · PLANAR',title:'Triangle',dim:'2D',chip:'dependent strip',
  elTex:raw`dA = w(y)\,dy,\qquad w(y)=b\!\left(1-\tfrac{y}{h}\right)`, elTexShort:'dA = w(y) dy', status:'ready', factory:triFactory,
  info:{why:'A strip inside a triangle is still a rectangle — but its width is no longer free. The slanted side, via similar triangles, pins the width to the height: w(y)/b = (h−y)/h. The element carries that geometric dependence into the integral; that is the whole skill.',
    texBlocks:[
      {label:'the element',tex:raw`dA = w(y)\,dy,\qquad w(y)=b\!\left(1-\tfrac{y}{h}\right)`},
      {label:'summing every strip',tex:raw`A=\int_0^h b\!\left(1-\tfrac{y}{h}\right)dy=\tfrac12 bh`}],
    tip:'Turn on “similar triangles” and drag y — the dashed coral triangle is always similar to the big one. Notice the strip’s corner slightly overshoots the hypotenuse: that leftover sliver is exactly what Δy → 0 erases.'}},

 /* ---- 2D / PLANAR ---- */

 {id:'disc',n:'06',group:'2D · PLANAR',title:'Circular Disc',dim:'2D',chip:'ring element',
  elTex:raw`dA = 2\pi r\,dr`, elTexShort:'dA = 2πr dr', status:'ready', factory:discFactory,
  info:{why:'Every point in a disc has a distance r from the centre, so r is the natural variable. Take the ring at radius r with thickness dr: all of its points sit at (essentially) the same radius, so one label covers the whole element. Cut the ring and unroll it — it flattens into a rectangle of length 2πr and width dr.',
    texBlocks:[
      {label:'the element',tex:raw`dA=\underbrace{2\pi r}_{\text{circumference}}\;\underbrace{dr}_{\text{width}}`},
      {label:'summing every ring',tex:raw`A=\int_0^R 2\pi r\,dr=\pi R^2`}],
    tip:'Flip on “unroll the ring” — the morph shows why the ring counts as a rectangle: when dr is tiny, no wedge-curvature is left. Then sweep r and watch dA grow like r.'}},

 {id:'disc_sector',n:'07',group:'2D · PLANAR',title:'Circular Disc (Sector)',dim:'2D',chip:'wedge element',
  elTex:raw`dA = \tfrac12 R^2\,d\theta`, elTexShort:'dA = ½ R² dθ', status:'ready', factory:discSectorFactory,
  info:{why:'Instead of concentric rings, slice the disc like a pie into N radial wedges of angular width dθ. As dθ → 0, each wedge becomes an isosceles triangle with apex at the origin, height R, and base along the circular rim of length R·dθ. The elementary area formula ½ · base · height yields dA = ½ R² dθ.',
    texBlocks:[
      {label:'the element (triangle approximation)',tex:raw`dA = \tfrac12 \cdot \underbrace{(R\,d\theta)}_{\text{base}}\;\underbrace{R}_{\text{height}} = \tfrac12 R^2\,d\theta`},
      {label:'summing every wedge around the circle',tex:raw`A = \int_0^{2\pi} \tfrac12 R^2\,d\theta = \tfrac12 R^2 (2\pi) = \pi R^2`}],
    tip:'Toggle “straight chord (Δ)” to compare the curved arc rim against the straight triangle base. The chord length is 2R sin(dθ/2); in the Taylor limit sin(dθ/2) ≈ dθ/2, so the discrepancy vanishes as dθ³.'}},

 {id:'disc_arcedge',n:'08',group:'2D · PLANAR',title:'Disc: Edge-Centered Arcs',dim:'2D',chip:'boundary arc element',
  elTex:raw`dA = 2r\arccos\!\left(\tfrac{r}{2R}\right)dr`, elTexShort:'dA = 2r arccos(r/2R) dr', status:'ready', factory:discArcEdgeFactory,
  info:{why:'Fix a point P on the circular boundary. Sweep concentric circular arcs of radius r centered at P across the disc (0 ≤ r ≤ 2R). By the isosceles triangle ΔPOQ with sides R, R and base r, the half-angle subtended at P satisfies cosφ = (r/2)/R = r/(2R). The arc length inside the disc is s(r) = 2r arccos(r/2R), and multiplying by thickness dr yields the area element.',
    texBlocks:[
      {label:'subtended angle from boundary pole P',tex:raw`\cos\phi = \frac{r/2}{R} = \frac{r}{2R} \implies \phi(r) = \arccos\!\left(\frac{r}{2R}\right)`},
      {label:'the element: arc length × thickness',tex:raw`dA = \underbrace{2r\arccos\!\left(\tfrac{r}{2R}\right)}_{\text{arc length } s(r)}\,dr`},
      {label:'integrating from P to the antipodal point',tex:raw`A = \int_0^{2R} 2r\arccos\!\left(\tfrac{r}{2R}\right)dr = \pi R^2`}],
    tip:'Turn on “triangle ΔPOQ (cosφ)” to see the geometric proof in action. This construction models Huygens wavelets radiating from a boundary source or antenna coverage across a circular basin.'}},

 /* ---- 3D / SOLIDS ---- */
 {id:'sphere',n:'09',group:'3D · SOLIDS',title:'Solid Sphere',dim:'3D',chip:'shell element',
  elTex:raw`dV = 4\pi r^2\,dr`, elTexShort:'dV = 4πr² dr', status:'ready', factory:sphereFactory,
  info:{why:'For a ball, radius is the natural coordinate. A thin shell at radius r collects every point between r and r + dr — one label for a whole layer, like an onion skin. Its volume is surface area × thickness: the sphere area 4πr² multiplied by dr.',
    texBlocks:[
      {label:'the element',tex:raw`dV=\underbrace{4\pi r^2}_{\text{shell area}}\;dr`},
      {label:'stacking every shell',tex:raw`V=\int_0^R 4\pi r^2\,dr=\tfrac{4}{3}\pi R^3`}],
    tip:'Turn on cutaway, then drag r — each shell is one onion layer, and the dark core is the integral you have already accumulated. “Peel shell off” hands the element to the class for inspection. Drag the canvas to orbit.'}},

 {id:'sphere_disc',n:'10',group:'3D · SOLIDS',title:'Solid Sphere (Disc Slices)',dim:'3D',chip:'disc slice element',
  elTex:raw`dV = \pi\,[r(y)]^2\,dy = \pi(R^2-y^2)\,dy`, elTexShort:'dV = π(R²−y²) dy', status:'ready', factory:sphereDiscFactory,
  info:{why:'Rather than peeling concentric onion shells (module 09), slice the sphere horizontally along its axis into thin circular discs from y = −R to y = +R. By Pythagoras in the vertical cross-section, the radius of the disc at height y is r(y) = √(R² − y²). Each disc has area π·[r(y)]² = π(R² − y²) and infinitesimal thickness dy.',
    texBlocks:[
      {label:'disc radius from Pythagoras',tex:raw`[r(y)]^2 + y^2 = R^2 \implies r(y) = \sqrt{R^2 - y^2}`},
      {label:'the element: circular slab volume',tex:raw`dV = \underbrace{\pi [r(y)]^2}_{\text{disc area}}\;dy = \pi(R^2 - y^2)\,dy`},
      {label:'stacking every disc along the axis',tex:raw`V = \int_{-R}^{R} \pi(R^2 - y^2)\,dy = \pi\left[R^2 y - \tfrac{y^3}{3}\right]_{-R}^{R} = \tfrac{4}{3}\pi R^3`}],
    tip:'Orbit the sphere and turn on “triangle (R, y, r)”. Notice how the disc area shrinks quadratically as |y| approaches the poles, unlike the cylinder where discs are identical.'}},

 {id:'hshell',n:'11',group:'3D · SOLIDS',title:'Hollow Sphere (Shell)',dim:'3D',chip:'latitude band',
  elTex:raw`dA=\underbrace{2\pi R\sin\theta}_{\text{ring length}}\;\underbrace{R\,d\theta}_{\text{band width}}`, elTexShort:'dA = 2πR sinθ · R dθ', status:'ready', factory:hshellFactory,
  info:{why:'A hollow ball has fixed radius — the only freedom is angle. Slice it into latitude ribbons: each is a ring of radius R·sinθ (so length 2πR·sinθ) with slant width R·dθ. The sinθ factor is geometry doing the bookkeeping: ribbons shrink as they approach the poles.',
    texBlocks:[
      {label:'the element',tex:raw`dA=\underbrace{2\pi R\sin\theta}_{\text{ring length}}\;\underbrace{R\,d\theta}_{\text{band width}}`},
      {label:'summing every ribbon',tex:raw`A=\int_0^{\pi}2\pi R^2\sin\theta\,d\theta=4\pi R^2`}],
    tip:'Sweep θ pole-to-pole and have students predict where dA is largest before revealing it (the equator, where sinθ = 1). Then pull the band: the unrolled ribbon makes “length × width” literal.'}},

 {id:'cone',n:'12',group:'3D · SOLIDS',title:'Solid Cone',dim:'3D',chip:'disc element',
  elTex:raw`dV=\pi\,[r(y)]^2\,dy,\qquad r(y)=\tfrac{R}{h}\,y`, elTexShort:'dV = π r(y)² dy', status:'ready', factory:coneFactory,
  info:{why:'Stack thin discs along the axis, measuring y down from the apex. The cone’s straight side plus similar triangles fix each disc’s radius: r(y) = R·y/h. The element is just “disc area × thickness” — with the geometry hidden inside r(y).',
    texBlocks:[
      {label:'the element',tex:raw`dV=\pi\,[r(y)]^2\,dy,\qquad r(y)=\tfrac{R}{h}\,y`},
      {label:'stacking every disc',tex:raw`V=\int_0^h \pi\!\left(\tfrac{R}{h}y\right)^2dy=\tfrac13\pi R^2h`}],
    tip:'The dark core is the partial integral — watch it swell as you sweep y toward the base. Ask: why do the thin top discs contribute so little? (Area scales like y², not y.)'}},

 {id:'coneh',n:'13',group:'3D · SOLIDS',title:'Hollow Cone (Surface)',dim:'3D',chip:'slant ring',
  elTex:raw`dA = 2\pi r\,d\ell`, elTexShort:'dA = 2πr dℓ', status:'ready', factory:conehFactory,
  info:{why:'On the slanted wall you must measure along the wall. Rings of radius r carry a width dℓ down the generator — and dℓ is the hypotenuse of a dr-by-dy triangle, exactly like module 03. Using dy instead of dℓ is the classic mistake this module exists to prevent.',
    texBlocks:[
      {label:'the element',tex:raw`dA = 2\pi r\,d\ell,\qquad d\ell=\sqrt{dr^2+dy^2}`},
      {label:'summing every ring',tex:raw`A=\int_0^{\ell_0} 2\pi r\,d\ell=\pi R\,\ell_0`}],
    tip:'Leave the coral dr–dy–dℓ triangle on and ask students which leg the ring “steps along.” Then pose the trap: what goes wrong if we use dy as the width? (The strips overlap the surface at an angle — area comes out short by cosα.)'}},

 /* ---- MULTIVARIABLE ---- */
 {id:'cart',n:'14',group:'MULTIVARIABLE',title:'Cartesian Volume',dim:'3D',chip:'brick element',
  elTex:raw`dV = dx\,dy\,dz`, elTexShort:'dV = dx dy dz', status:'ready', factory:cartFactory,
  info:{why:'In Cartesian space the three directions are independent — box-shaped bricks dx·dy·dz tile any region, and each thickness is read straight off the axes. No hidden geometry, no extra factors: this is the baseline every curvilinear element will be compared against.',
    texBlocks:[
      {label:'the element',tex:raw`dV = dx\,dy\,dz`},
      {label:'the total',tex:raw`V=\iiint dx\,dy\,dz = abc`}],
    tip:'Three sliders, three independent directions — stress that nothing in the brick depends on where it sits. That innocence is exactly what the next two modules lose, and why.'}},

 {id:'cyl',n:'15',group:'MULTIVARIABLE',title:'Cylindrical Volume',dim:'3D',chip:'wedge element',
  elTex:raw`dV = r\,dr\,d\theta\,dz`, elTexShort:'dV = r dr dθ dz', status:'ready', factory:cylFactory,
  info:{why:'Around an axis the natural brick is a curved wedge: radial thickness dr, height dz, and an arc edge. The angle step dθ is the same everywhere — but the arc it sweeps grows with radius: length r·dθ. That single stretch is the entire Jacobian.',
    texBlocks:[
      {label:'the element — three honest edges',tex:raw`dV = dr\;\underbrace{(r\,d\theta)}_{\text{arc length}}\;dz`},
      {label:'the total',tex:raw`V=\int_0^h\!\int_0^{2\pi}\!\int_0^R r\,dr\,d\theta\,dz=\pi R^2h`}],
    tip:'Compare the blue dθ arc near the axis with the coral r·dθ arc on the wedge: same angle, different lengths. Sweep r outward and let students watch the extra r grow — then sweep θ to send the wedge orbiting the axis.'}},

 {id:'sphv',n:'16',group:'MULTIVARIABLE',title:'Spherical Volume',dim:'3D',chip:'spherical cell',
  elTex:raw`dV = r^2\sin\theta\,dr\,d\theta\,d\phi`, elTexShort:'dV = r² sinθ dr dθ dφ', status:'ready', factory:sphvFactory,
  info:{why:'The most layered brick of all: step dr outward, r·dθ down a meridian, and r·sinθ·dφ around a latitude circle. Two of the three edges carry an r because arcs grow with radius; one also carries sinθ because latitude circles shrink toward the poles. Multiply the three edges — the Jacobian writes itself.',
    texBlocks:[
      {label:'the element — three honest edges',tex:raw`dV = dr\;\underbrace{(r\,d\theta)}_{\text{meridian}}\;\underbrace{(r\sin\theta\,d\phi)}_{\text{latitude}}`},
      {label:'the total',tex:raw`V=\int r^2\sin\theta\,dr\,d\theta\,d\phi=\tfrac43\pi R^3`}],
    tip:'Press “explode cell” and read the three edge labels aloud — dr, r dθ, r sinθ dφ — then ask which edge dies at the poles and why (sinθ → 0). Finish the course arc: sweep φ at the equator, then near a pole, and compare.'}},
];

/* ============================ navigation & boot ============================ */
const nav=$('#sideNav');
let currentId=null;
function buildNav(){
  let last='';
  MODULES.forEach(m=>{
    if(m.group!==last){last=m.group;nav.appendChild(el('div','grpTitle',null,m.group));}
    const b=el('button','navItem');b.dataset.id=m.id;
    b.innerHTML=`<span class="nNum">${m.n}</span><span>${m.title}</span>
      <span class="dot ${m.status==='ready'?'ready':'queued'}"></span>`;
    b.addEventListener('click',()=>openModule(m.id));
    nav.appendChild(b);});
  const ready=MODULES.filter(m=>m.status==='ready').length;
  const modCount=$('#modCount');
  if(modCount) modCount.textContent=`${ready} / ${MODULES.length}`;
}
function openModule(id){
  stopSweep();
  if(live&&live.dispose)live.dispose(); live=null; sweepFn=null;
  if(playBtn)playBtn.remove();
  const m=MODULES.find(x=>x.id===id); currentId=id;
  document.querySelectorAll('.navItem').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  $('#stageNum').textContent=m.n; $('#stageTitle').textContent=m.title;
  $('#chipDim').textContent=`${m.dim} · ${m.group}`; $('#chipEl').textContent=m.chip;
  controlsBar.innerHTML=''; mount.innerHTML=''; setLegend([]); $('#figCap').textContent='';
  const old=$('#readout'); if(old)old.remove();
  renderDossier(m);
  if(m.status!=='ready'){renderQueued(m);}
  else{
    const ctx={
      readout:rows=>renderReadout(rows),
      legend:setLegend,
      caption:t=>{$('#figCap').textContent=t;},
      setSweep:fn=>{sweepFn=fn;
        playBtn=el('button','playBtn',null,'<span>▶</span> sweep');
        playBtn.addEventListener('click',toggleSweep);
        controlsBar.appendChild(playBtn);},
      sweepDur:4};
    live=m.factory(ctx)||{};
    if(m.factory===sphereFactory){} /* sweepDur already set inside factories */
    sweepDur=(m.id==='sphere'||m.id==='sphere_disc'?5:ctx.sweepDur)||4.5;
  }
  if(canvasWrapEl) canvasWrapEl.classList.toggle('text-deactivated',!viewTextActive);
  replayAnim($('#stageCard'),'entering');
}

/* ============================ view panel text toggle ============================ */
let viewTextActive=true;
const canvasWrapEl=$('#canvasWrap');
const viewTextBtn=$('#viewTextBtn');
function setViewText(active){
  viewTextActive=active;
  if(canvasWrapEl)canvasWrapEl.classList.toggle('text-deactivated',!viewTextActive);
  if(viewTextBtn){
    viewTextBtn.classList.toggle('active',viewTextActive);
    viewTextBtn.setAttribute('aria-pressed',viewTextActive);
    const st=viewTextBtn.querySelector('.vtStatus');
    if(st)st.textContent=viewTextActive?'ON':'OFF';
  }
}
if(viewTextBtn){
  viewTextBtn.addEventListener('click',()=>setViewText(!viewTextActive));
}

document.addEventListener('keydown',e=>{
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(e.key==='t'||e.key==='T'){setViewText(!viewTextActive);return;}
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  const i=MODULES.findIndex(m=>m.id===currentId);
  const j=(i+(e.key==='ArrowRight'?1:-1)+MODULES.length)%MODULES.length;
  openModule(MODULES[j].id);
});

buildNav();
openModule('wire');
</script>

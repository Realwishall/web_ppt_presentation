<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>00 - Basic Math - 01.XX Integration on object.html</title>

<!-- ============ FONTS ============ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ============ KATEX (math rendering) ============ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

<!-- ============ THREE.JS (import map for 3D modules) ============ -->
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<style>
/* ==========================================================================
   THE DIFFERENTIAL ELEMENT — chalkboard-lab visual system
   ========================================================================== */
:root{
  --bg0:#0b1613; --bg1:#0f201b;
  --panel:#12261f; --panel2:#0d1c17;
  --ink:#e9f2ea; --ink-dim:#9db4a7; --ink-faint:#5d7a6d;
  --chalk:#f4f1e4;
  --amber:#ffb84d; --amber-deep:#d98f1f;
  --teal:#67e0c2; --sky:#8ecbff; --coral:#ff8a70;
  --line:rgba(180,225,200,.14);
  --grid:rgba(120,230,190,.05);
  --disp:'Bricolage Grotesque',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:var(--body); color:var(--ink); overflow:hidden;
  background:
    radial-gradient(1200px 700px at 70% -10%, rgba(103,224,194,.06), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(255,184,77,.05), transparent 60%),
    linear-gradient(160deg, var(--bg1), var(--bg0) 65%);
}
body::before{ /* vignette */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.45));
}
::selection{background:rgba(255,184,77,.35)}

/* ---- drifting ambient math glyphs ---- */
.amb{position:fixed; z-index:0; pointer-events:none; color:rgba(150,230,200,.08);
  font-family:var(--disp); animation:drift var(--dur,9s) ease-in-out var(--del,0s) infinite alternate;}
@keyframes drift{from{transform:translateY(-14px) rotate(-3deg)}to{transform:translateY(14px) rotate(2.5deg)}}

/* ================= APP GRID ================= */
.app{position:relative; z-index:1; display:grid; height:100vh;
  grid-template-columns:266px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr);
  gap:14px; padding:14px 18px 18px;}

/* ================= SIDEBAR NAV ================= */
.side{overflow:auto; min-height:0; padding-right:4px;}
.grpTitle{font-family:var(--mono); font-size:10px; letter-spacing:.22em; color:var(--ink-faint);
  text-transform:uppercase; margin:16px 8px 7px; display:flex; align-items:center; gap:8px;}
.grpTitle::after{content:""; flex:1; height:1px; background:var(--line);}
.navItem{width:100%; display:grid; grid-template-columns:26px 1fr 12px; align-items:center; gap:8px;
  background:none; border:none; border-left:3px solid transparent; color:var(--ink-dim);
  font-family:var(--body); font-size:13.5px; text-align:left; padding:8px 10px; cursor:pointer;
  transition:.2s; border-radius:0 8px 8px 0;}
.navItem .nNum{font-family:var(--mono); font-size:10.5px; color:var(--ink-faint);}
.navItem:hover{background:rgba(255,255,255,.035); color:var(--chalk); transform:translateX(3px);}
.navItem.active{border-left-color:var(--amber); background:rgba(255,184,77,.09); color:var(--chalk);}
.navItem.active .nNum{color:var(--amber);}
.dot{width:7px;height:7px;border-radius:50%;}
.dot.ready{background:var(--amber); animation:ping 2.4s ease-out infinite;}
.dot.queued{background:transparent; border:1.5px solid var(--ink-faint);}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,184,77,.5)}70%{box-shadow:0 0 0 7px rgba(255,184,77,0)}100%{box-shadow:0 0 0 0 rgba(255,184,77,0)}}

/* ================= STAGE ================= */
.stageCol{display:flex; min-width:0; min-height:0;}
.stageCard{flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line); border-radius:12px;}
.stageHead{display:flex; align-items:center; gap:16px; padding:14px 18px 10px;}
.bigNum{font-family:var(--disp); font-weight:800; font-size:56px; line-height:.9;
  color:var(--amber); text-shadow:0 0 26px rgba(255,184,77,.35); min-width:76px;}
.stageHead h2{font-family:var(--disp); font-weight:700; font-size:23px; letter-spacing:-.01em;}
.chips{display:flex; gap:8px; margin-top:5px;}
.chip{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  padding:4px 10px; border-radius:99px; border:1px solid var(--line); color:var(--ink-dim);}
.chip.amber{border-color:rgba(255,184,77,.4); color:var(--amber);}

/* ---- control strip ---- */
.controls{display:flex; flex-wrap:wrap; align-items:center; gap:14px 20px;
  padding:10px 18px; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line);
  background:rgba(0,0,0,.18); min-height:56px;}
.ctl{display:flex; align-items:center; gap:9px;}
.ctlLabel{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-dim);}
.ctlVal{font-family:var(--mono); font-size:11px; color:var(--amber); min-width:56px; text-align:right;}
input[type=range]{-webkit-appearance:none; appearance:none; width:150px; height:4px; border-radius:4px;
  background:linear-gradient(to right, var(--amber) var(--p,50%), rgba(255,255,255,.12) var(--p,50%));
  outline:none; cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px;height:16px;border-radius:50%;
  background:var(--amber); border:2px solid #241703; box-shadow:0 0 0 0 rgba(255,184,77,.4);
  transition:box-shadow .25s;}
input[type=range]::-webkit-slider-thumb:hover{box-shadow:0 0 0 7px rgba(255,184,77,.18);}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--amber);border:2px solid #241703;}
.switch{display:flex; align-items:center; gap:9px; background:none; border:1px solid var(--line);
  border-radius:99px; padding:5px 12px 5px 6px; cursor:pointer; color:var(--ink-dim);
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; transition:.25s;}
.switch .knob{width:26px;height:14px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;transition:.25s;flex:none;}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;
  background:var(--ink-dim);transition:.25s;}
.switch:hover{border-color:rgba(255,184,77,.5);}
.switch.on{color:var(--amber); border-color:rgba(255,184,77,.55); background:rgba(255,184,77,.07);}
.switch.on .knob{background:rgba(255,184,77,.35);}
.switch.on .knob::after{left:14px;background:var(--amber);}
.playBtn{display:flex;align-items:center;gap:8px;margin-left:auto;background:rgba(255,184,77,.1);
  border:1.5px solid var(--amber); color:var(--amber); border-radius:99px; padding:6px 16px;
  font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; cursor:pointer; transition:.2s;}
.playBtn:hover{background:rgba(255,184,77,.22); transform:translateY(-1px);}
.playBtn.playing{background:var(--amber); color:#241703;}

/* ---- canvas ---- */
.canvasWrap{flex:1; position:relative; min-height:300px;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(rgba(120,230,190,.075) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,230,190,.075) 1px, transparent 1px);
  background-size:26px 26px, 26px 26px, 130px 130px, 130px 130px;}
.mount{position:absolute; inset:0; overflow:hidden;}
.mount svg.fig{position:absolute; inset:0; width:100%; height:100%;}
.tick{position:absolute; width:14px;height:14px; border-color:rgba(244,241,228,.35)!important; z-index:3; pointer-events:none;}
.t-tl{top:8px;left:8px;border-top:1.5px solid;border-left:1.5px solid;}
.t-tr{top:8px;right:8px;border-top:1.5px solid;border-right:1.5px solid;}
.t-bl{bottom:8px;left:8px;border-bottom:1.5px solid;border-left:1.5px solid;}
.t-br{bottom:8px;right:8px;border-bottom:1.5px solid;border-right:1.5px solid;}
.figCap{position:absolute; left:16px; bottom:10px; font-family:var(--mono); font-size:10.5px;
  color:var(--ink-faint); z-index:3; pointer-events:none;}
.legend{position:absolute; right:16px; bottom:10px; display:flex; gap:14px; z-index:3; pointer-events:none;}
.lg{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; color:var(--ink-dim);}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block;}
.lbl3{position:absolute; z-index:4; pointer-events:none; font-family:var(--mono); font-size:12px;
  color:var(--chalk); background:rgba(10,22,18,.75); border:1px solid var(--line);
  padding:2px 8px; border-radius:6px; transform:translate(-50%,-50%); transition:opacity .3s; white-space:nowrap;}
.lbl3.big{color:var(--amber); border-color:rgba(255,184,77,.55); font-size:13px;
  box-shadow:0 0 22px rgba(255,184,77,.18);}

/* ---- view panel text toggle button ---- */
.viewTextBtn{position:absolute; top:14px; right:20px; z-index:10;
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(18,38,31,.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:99px; padding:6px 14px;
  font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-dim); cursor:pointer; transition:all .2s ease; user-select:none;}
.viewTextBtn:hover{border-color:rgba(255,184,77,.55); color:var(--chalk); transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(0,0,0,.35);}
.viewTextBtn.active{color:var(--amber); border-color:rgba(255,184,77,.55); background:rgba(255,184,77,.1);
  box-shadow:0 0 16px rgba(255,184,77,.15);}
.viewTextBtn .vtDot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint); transition:all .2s ease;}
.viewTextBtn.active .vtDot{background:var(--amber); box-shadow:0 0 7px var(--amber);}
.viewTextBtn .vtStatus{font-weight:600; min-width:22px; text-align:left;}

/* When text is deactivated on view panel */
.canvasWrap.text-deactivated svg text,
.canvasWrap.text-deactivated .lbl3,
.canvasWrap.text-deactivated .figCap,
.canvasWrap.text-deactivated .legend {
  opacity:0 !important; visibility:hidden !important; pointer-events:none !important;
  transition:opacity .25s ease, visibility .25s ease;
}
svg text, .lbl3, .figCap, .legend {
  transition:opacity .25s ease, visibility .25s ease;
}

/* ---- SVG figure classes ---- */
.monoTxt{font-family:var(--mono); fill:var(--ink-dim); font-size:14px;}
.chalkTxt{font-family:var(--mono); fill:var(--chalk);}
.amberTxt{font-family:var(--mono); fill:var(--amber);}
.axisLn{stroke:rgba(233,242,234,.28); stroke-width:1.4;}
.faintLn{stroke:rgba(233,242,234,.22); stroke-width:1; stroke-dasharray:3 5;}
.bigNote{font-family:var(--body); font-style:italic; fill:var(--chalk); font-size:17px; opacity:0; transition:opacity .5s;}
.elPulse{animation:elPulse 2.3s ease-in-out infinite;}
@keyframes elPulse{50%{opacity:.7}}
.pullLift{transition:transform .8s cubic-bezier(.2,.75,.2,1);}

/* ---- queued placeholder ---- */
.queuedCard{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:14px; text-align:center; padding:30px;}
.qNum{font-family:var(--disp); font-weight:800; font-size:110px; line-height:1;
  color:transparent; -webkit-text-stroke:1.5px rgba(255,184,77,.45);}
.queuedCard h3{font-family:var(--disp); font-size:26px;}
.qEl{font-size:1.5em; color:var(--chalk);}
.qNote{max-width:520px; color:var(--ink-dim); font-size:14px; line-height:1.55;}
.qPlan{font-family:var(--mono); font-size:11px; color:var(--teal); border:1px dashed rgba(103,224,194,.4);
  border-radius:8px; padding:8px 16px;}
.qPlan span{color:var(--ink-faint); margin-right:8px;}

/* ================= DOSSIER (right panel) ================= */
.dossier{overflow:auto; min-height:0; padding:4px 2px;}
.dossier h3{font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--amber); margin:18px 0 10px;}
.dossier h3:first-child{margin-top:4px;}
.dossier p{font-size:14px; line-height:1.65; color:#c9d9cd;}
.formula{background:rgba(0,0,0,.28); border-left:3px solid var(--amber); border-radius:0 10px 10px 0;
  padding:12px 16px; margin:12px 0;}
.fLabel{font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--ink-faint); display:block; margin-bottom:8px;}
.texLine{color:var(--chalk); overflow-x:auto; overflow-y:hidden; padding:2px 0;}
.texLine .katex{font-size:1.18em;}
.tex-fallback{font-family:var(--mono); font-size:12px; color:var(--teal);}
.readout{border:1px solid var(--line); border-radius:10px; padding:6px 14px; margin:12px 0;
  background:rgba(103,224,194,.04);}
.rRow{display:flex; justify-content:space-between; gap:12px; padding:7px 0;
  border-bottom:1px dashed rgba(255,255,255,.07); font-size:13px;}
.rRow:last-child{border-bottom:none;}
.rK{color:var(--ink-dim);}
.rV{font-family:var(--mono); color:var(--teal);}
.tip{border:1.5px dashed rgba(255,184,77,.4); border-radius:10px; padding:12px 14px;
  font-size:13px; line-height:1.55; color:#d8e4da; margin:14px 0 20px;}
.tip b{color:var(--amber);}
.dossier>*{animation:riseIn .55s cubic-bezier(.2,.7,.2,1) both;}
.dossier>*:nth-child(2){animation-delay:.05s}.dossier>*:nth-child(3){animation-delay:.1s}
.dossier>*:nth-child(4){animation-delay:.15s}.dossier>*:nth-child(5){animation-delay:.2s}
.dossier>*:nth-child(6){animation-delay:.25s}.dossier>*:nth-child(7){animation-delay:.3s}
@keyframes riseIn{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
.stageCard.entering{animation:cardIn .5s cubic-bezier(.2,.7,.2,1) both;}
@keyframes cardIn{from{opacity:0; transform:translateY(12px) scale(.995)}to{opacity:1; transform:none}}

/* scrollbars */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,184,77,.3)}

/* ================= RESPONSIVE ================= */
@media(max-width:1240px){
  .app{grid-template-columns:230px minmax(0,1fr);}
  body{overflow:auto;} .app{height:auto; min-height:100vh;}
}
@media(max-width:820px){
  .app{grid-template-columns:1fr; grid-template-rows:auto 1fr;}
  .side{display:flex; overflow-x:auto; gap:6px; padding-bottom:6px;}
  .grpTitle{display:none;}
  .navItem{border-left:none; border-bottom:3px solid transparent; border-radius:8px 8px 0 0; white-space:nowrap; width:auto;}
  .navItem.active{border-bottom-color:var(--amber);}
}
</style>

<body>

<!-- drifting ambient glyphs (populated by JS) -->
<div id="ambient" aria-hidden="true"></div>

<div class="app">

  <!-- ================= NAV ================= -->
  <nav class="side" id="sideNav"></nav>

  <!-- ================= STAGE ================= -->
  <main class="stageCol">
    <section class="stageCard" id="stageCard">
      <div class="stageHead">
        <span class="bigNum" id="stageNum">01</span>
        <div>
          <h2 id="stageTitle">—</h2>
          <div class="chips"><span class="chip" id="chipDim">—</span><span class="chip amber" id="chipEl">—</span></div>
        </div>
      </div>
      <div class="controls" id="controlsBar"></div>
      <div class="canvasWrap" id="canvasWrap">
        <button id="viewTextBtn" class="viewTextBtn active" type="button" aria-pressed="true" title="Toggle text on view panel (Shortcut: T)">
          <span class="vtDot"></span>
          <span>Text</span>
          <span class="vtStatus">ON</span>
        </button>
        <div class="mount" id="mount"></div>
        <span class="tick t-tl"></span><span class="tick t-tr"></span>
        <span class="tick t-bl"></span><span class="tick t-br"></span>
        <div class="figCap" id="figCap"></div>
        <div class="legend" id="legend"></div>
      </div>
    </section>
  </main>

</div>

<!-- GSAP (loaded before the app module; a tiny fallback is defined in-app if it fails) -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

<script type="module">
/* ============================================================================
   THE DIFFERENTIAL ELEMENT — application
   ----------------------------------------------------------------------------
   HOW TO ADD A MODULE (teacher notes):
   1) Add an entry to the MODULES registry at the bottom of this file.
      - status:'ready'   → needs a factory function that builds the scene.
      - status:'queued'  → shows a placeholder card; maths already displayed.
   2) A factory receives ctx = { mount, controlsBar, readout(), legend(),
      caption(), setSweep() } and returns { dispose() }.
   3) Use makeSlider / makeToggle to build controls; call ctx.readout() to
      refresh live values; call ctx.setSweep(t) to enable the ▶ sweep button.
   ========================================================================== */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- micro-fallback if the GSAP CDN is blocked ---------- */
if(!window.gsap){
  const easeIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
  const SKIP=['duration','delay','ease','onUpdate','onComplete','repeat','yoyo','overwrite'];
  window.gsap={_t:[],
    to(target,vars){const anim={target,raf:0};this._t.push(anim);
      const dur=Math.max(vars.duration??.5,.001)*1000, delay=(vars.delay??0)*1000;
      const keys=Object.keys(vars).filter(k=>typeof vars[k]==='number'&&!SKIP.includes(k));
      const from={};keys.forEach(k=>from[k]=target[k]);const t0=performance.now()+delay;
      const step=now=>{let p=(now-t0)/dur;
        if(p<0){anim.raf=requestAnimationFrame(step);return;}
        p=Math.min(p,1);const e=easeIO(p);
        keys.forEach(k=>target[k]=from[k]+(vars[k]-from[k])*e);
        vars.onUpdate&&vars.onUpdate();
        if(p<1)anim.raf=requestAnimationFrame(step);
        else{this._t=this._t.filter(a=>a!==anim);vars.onComplete&&vars.onComplete();}};
      anim.raf=requestAnimationFrame(step);return anim;},
    killTweensOf(target){this._t=this._t.filter(a=>{if(a.target===target){cancelAnimationFrame(a.raf);return false;}return true;});}};
}

/* ============================ DOM / misc helpers ============================ */
const $=s=>document.querySelector(s);
function el(tag,cls,html){const d=document.createElement(tag);if(cls)d.className=cls;if(html!=null)d.innerHTML=html;return d;}
function svgEl(n,attrs={},parent){const e=document.createElementNS('http://www.w3.org/2000/svg',n);
  for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- KaTeX helper with graceful fallback ---------- */
const texJobs=[];
function tex(elm,str,display=true){texJobs.push({elm,str,display});paintTex(elm,str,display);}
function paintTex(elm,str,display){
  if(window.katex){try{katex.render(str,elm,{displayMode:display,throwOnError:false});}catch(e){elm.textContent=str;}}
  else{elm.classList.add('tex-fallback');elm.textContent=str;}}
window.addEventListener('load',()=>{if(window.katex)texJobs.forEach(j=>paintTex(j.elm,j.str,j.display));});

/* ---------- ambient glyphs ---------- */
(function ambient(){
  const g=['∫','∂','Σ','dθ','ρ','∇','dx','Δ→0','π','r²','dℓ','∮','λ','4πr²'];
  const host=$('#ambient');
  g.forEach((ch,i)=>{const s=el('span','amb',ch);
    s.style.left=(6+ (i*67)%88)+'%'; s.style.top=(8+(i*37)%80)+'%';
    s.style.fontSize=(26+(i*13)%40)+'px';
    s.style.setProperty('--dur',(7+i%6*1.7)+'s'); s.style.setProperty('--del',(i*.7)+'s');
    host.appendChild(s);});
})();

/* ============================ control builders ============================ */
function makeSlider(bar,{label,min,max,step,value,fmt,onInput}){
  const w=el('div','ctl'); w.innerHTML=`<span class="ctlLabel">${label}</span>`;
  const inp=document.createElement('input');
  Object.assign(inp,{type:'range',min,max,step,value});
  const badge=el('span','ctlVal');
  w.append(inp,badge); bar.appendChild(w);
  const paint=()=>{inp.style.setProperty('--p',((inp.value-min)/(max-min)*100)+'%');
    badge.textContent=fmt?fmt(+inp.value):inp.value;};
  inp.addEventListener('input',()=>{stopSweep();paint();onInput(+inp.value);});
  paint();
  return {set(v){inp.value=v;paint();}};
}
function makeToggle(bar,{label,value,onInput}){
  const b=el('button','switch'+(value?' on':'')); b.type='button';
  b.setAttribute('role','switch'); b.setAttribute('aria-checked',value);

    b.classList.toggle('on',on); b.setAttribute('aria-checked',on); onInput(on);});
  bar.appendChild(b);
  return {set(v){b.classList.toggle('on',v);b.setAttribute('aria-checked',v);}};
}

/* ============================ Three.js stage helper ============================ */
function threeStage(mount){
  let renderer;
  try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}
  catch(e){return null;}
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.localClippingEnabled=true;
  renderer.domElement.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;';
  mount.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(42,1,.1,60);
  camera.position.set(2.7,1.9,3.4);
  const controls=new OrbitControls(camera,renderer.domElement);
  Object.assign(controls,{enableDamping:true,dampingFactor:.06,autoRotate:true,
    autoRotateSpeed:.7,minDistance:2,maxDistance:9,enablePan:false});
  let resumeT;
  controls.addEventListener('start',()=>{controls.autoRotate=false;clearTimeout(resumeT);});
  controls.addEventListener('end',()=>{resumeT=setTimeout(()=>controls.autoRotate=true,2600);});
  let raf=0,userFn=null;
  const size=()=>{const w=mount.clientWidth,h=mount.clientHeight;if(!w||!h)return;
    renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();};
  size(); const ro=new ResizeObserver(size); ro.observe(mount);
  const clock=new THREE.Clock();
  (function loop(){raf=requestAnimationFrame(loop);
    const t=clock.getElapsedTime();
    if(userFn)userFn(t); controls.update(); renderer.render(scene,camera);})();
  return {scene,camera,renderer,controls,
    start(fn){userFn=fn;},
    dispose(){cancelAnimationFrame(raf);ro.disconnect();controls.dispose();clearTimeout(resumeT);
      scene.traverse(o=>{o.geometry&&o.geometry.dispose();
        if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose());});
      renderer.dispose();renderer.domElement.remove();}};
}

/* ============================ engine state ============================ */
const mount=$('#mount'), controlsBar=$('#controlsBar'), dossier=$('#dossier');
let live=null, sweepFn=null, sweepDur=4.5, playing=false, proxy={t:0}, playBtn=null;

function stopSweep(){ if(!playing)return; playing=false; gsap.killTweensOf(proxy);
  if(playBtn){playBtn.classList.remove('playing');playBtn.innerHTML='<span>▶</span> sweep';}}
function toggleSweep(){
  if(!sweepFn)return;
  if(playing){stopSweep();return;}
  playing=true; proxy.t=0;
  playBtn.classList.add('playing'); playBtn.innerHTML='<span>■</span> stop';
  gsap.to(proxy,{t:1,duration:sweepDur,
    onUpdate:()=>sweepFn(proxy.t),
    onComplete:()=>stopSweep()});
}
function renderReadout(rows){
  if(!dossier) return;
  let box=$('#readout');
  if(!box){box=el('div','readout');box.id='readout';dossier.appendChild(box);}
  box.innerHTML=rows.map(([k,v])=>`<div class="rRow"><span class="rK">${k}</span><span class="rV">${v}</span></div>`).join('');

/* ============================================================================
   MODULE 06 — CIRCULAR DISC  (2D, element ring, dA = 2πr dr)
   ========================================================================== */
function discFactory(ctx){
  const W=960,H=470,CX=268,CY=225,R=150,K=0.45,STRIP={x:648,y:352};
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'xMidYMid meet',class:'fig'},mount);
  const defs=svgEl('defs',{},svg);
  defs.innerHTML=`<filter id="glowD" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;

  const gDisc=svgEl('g',{},svg);
  svgEl('circle',{cx:CX,cy:CY,r:R,fill:'rgba(103,224,194,.07)',stroke:'var(--teal)','stroke-width':2},gDisc);
  svgEl('circle',{cx:CX,cy:CY,r:3,fill:'var(--chalk)'},gDisc);
  const gGhost=svgEl('g',{},svg);
  const ringGhost=svgEl('circle',{cx:CX,cy:CY,fill:'none',stroke:'var(--amber)','stroke-dasharray':'5 6',opacity:0},svg);
  const gCut=svgEl('g',{opacity:0},svg);
  const cutLn=svgEl('line',{stroke:'var(--coral)','stroke-width':1.6,'stroke-dasharray':'4 4'},gCut);
  const cutTxt=svgEl('text',{class:'monoTxt','font-size':12,fill:'var(--coral)'},gCut); cutTxt.textContent='cut';
  const radLn=svgEl('line',{stroke:'var(--chalk)','stroke-width':1.4,opacity:.8},svg);
  const radTxt=svgEl('text',{class:'chalkTxt','font-size':15},svg); radTxt.textContent='r';
  const elPath=svgEl('path',{fill:'none',stroke:'var(--amber)','stroke-linecap':'butt',filter:'url(#glowD)',class:'elPulse'},svg);
  const gStrip=svgEl('g',{opacity:0},svg);
  const sLen=svgEl('text',{class:'amberTxt','text-anchor':'middle','font-size':14},gStrip);
  const sDr=svgEl('text',{class:'amberTxt','font-size':13},gStrip);
  const sCap=svgEl('text',{class:'monoTxt','text-anchor':'middle','font-size':12.5},gStrip);
  sCap.textContent='unrolled ring ≈ thin rectangle';
  const sBrk=svgEl('line',{stroke:'var(--amber)','stroke-width':1.4},gStrip);

  const st={r:.62,N:28,ghosts:true,unroll:false,t:0};

  function arcPath(cx,cy,rho,phi,n=100){
    let d=''; const a0=-Math.PI/2-phi/2;
    for(let i=0;i<=n;i++){const a=a0+phi*i/n;
      d+=(i?'L':'M')+(cx+rho*Math.cos(a)).toFixed(2)+' '+(cy+rho*Math.sin(a)).toFixed(2);}
    return d;
  }
  function buildGhosts(){
    gGhost.innerHTML='';
    for(let i=1;i<st.N;i++)
      svgEl('circle',{cx:CX,cy:CY,r:R*i/st.N,fill:'none',stroke:'var(--teal)','stroke-width':1,opacity:.3},gGhost);
  }
  function render(){
    const e=st.t, rpx=st.r*R, drpx=R/st.N;
    const sig=lerp(1,K,e), sLenPx=2*Math.PI*rpx*sig;
    const rhoEnd=(2*Math.PI*rpx*K)/0.55;
    const rho=lerp(rpx,Math.max(rhoEnd,rpx+1),e);
    const phi=sLenPx/rho;
    const Sx=lerp(CX,STRIP.x,e), Sy=lerp(CY-rpx,STRIP.y,e);
    elPath.setAttribute('d',arcPath(Sx,Sy+rho,rho,phi));
    elPath.setAttribute('stroke-width',Math.max(lerp(drpx,drpx*K,e),2));
    gGhost.style.opacity=st.ghosts?(1-e):0;
    gDisc.setAttribute('opacity',1-.7*e);
    /* radius indicator */
    const A=-0.6, rx=CX+rpx*Math.cos(A), ry=CY+rpx*Math.sin(A);
    radLn.setAttribute('x1',CX);radLn.setAttribute('y1',CY);
    radLn.setAttribute('x2',rx);radLn.setAttribute('y2',ry);
    radLn.setAttribute('opacity',(1-e)*.8);
    radTxt.setAttribute('x',CX+rpx*.5*Math.cos(A)-16);
    radTxt.setAttribute('y',CY+rpx*.5*Math.sin(A)+4);
    radTxt.setAttribute('opacity',1-e);
    /* ghost of original ring + cut mark while unrolling */
    ringGhost.setAttribute('r',rpx); ringGhost.setAttribute('opacity',e*.85);
    cutLn.setAttribute('x1',CX);cutLn.setAttribute('y1',CY-rpx+6);
    cutLn.setAttribute('x2',CX);cutLn.setAttribute('y2',CY-rpx-18);
    cutTxt.setAttribute('x',CX+8);cutTxt.setAttribute('y',CY-rpx-10);
    gCut.setAttribute('opacity',clamp(e*2,0,1)*(1-e*.4));
    /* strip labels */
    const w=lerp(drpx,drpx*K,e);
    gStrip.setAttribute('opacity',clamp((e-.7)/.3,0,1));
    sLen.setAttribute('x',Sx); sLen.setAttribute('y',Sy+w/2+30);
    sLen.textContent=`length = 2πr ≈ ${(2*Math.PI*st.r).toFixed(2)} R`;
    sBrk.setAttribute('x1',Sx+sLenPx/2+14); sBrk.setAttribute('x2',Sx+sLenPx/2+14);
    sBrk.setAttribute('y1',Sy-w/2); sBrk.setAttribute('y2',Sy+w/2);
    sDr.setAttribute('x',Sx+sLenPx/2+22); sDr.setAttribute('y',Sy+4); sDr.textContent='dr';
    sCap.setAttribute('x',Sx); sCap.setAttribute('y',Sy+w/2+54);

    const drU=1/st.N, dA=2*Math.PI*st.r*drU;
    ctx.readout([
      ['ring radius r', st.r.toFixed(2)+' R'],
      ['ring width dr', `R/${st.N} ≈ ${drU.toFixed(3)} R`],
      ['element dA', `2πr·dr ≈ ${dA.toFixed(3)} R²`],
      ['rings total', st.N]]);
  }

  buildGhosts(); render();
  ctx.caption('fig. 06 — circular disc · element: concentric ring');
  ctx.legend([{c:'var(--teal)',t:'body (disc)'},{c:'var(--amber)',t:'element ring'},{c:'var(--coral)',t:'cut & unroll'}]);

  const sliders=[];
  sliders.push(makeSlider(controlsBar,{label:'radius r',min:.08,max:.97,step:.005,value:st.r,
    fmt:v=>v.toFixed(2)+' R', onInput:v=>{st.r=v;render();}}));
  makeSlider(controlsBar,{label:'rings N',min:4,max:28,step:1,value:st.N,
    fmt:v=>'N = '+v, onInput:v=>{st.N=v;buildGhosts();render();}});
  makeToggle(controlsBar,{label:'ghost rings',value:true,onInput:v=>{st.ghosts=v;render();}});
  makeToggle(controlsBar,{label:'unroll the ring',value:false,onInput:v=>{
    st.unroll=v; gsap.killTweensOf(st);
    gsap.to(st,{t:v?1:0,duration:1.15,ease:'power2.inOut',onUpdate:render});}});
  ctx.sweepDur=5;
  ctx.setSweep(t=>{const v=lerp(.08,.97,t); st.r=v; sliders[0].set(v); render();});

  return {dispose(){gsap.killTweensOf(st);stopSweep();}};
}

    slot.style.opacity=st.pull?1:0;

    /* Straight chord between rim endpoints */
    chordLn.setAttribute('x1',p1.x); chordLn.setAttribute('y1',p1.y);
    chordLn.setAttribute('x2',p2.x); chordLn.setAttribute('y2',p2.y);
    chordLn.style.opacity=(st.chord||st.pull)?1:0;

    /* dθ angle arc near center */
    const rArc=36, a1=pt(th1,rArc), a2=pt(th2,rArc);
    dthArc.setAttribute('d',`M ${a1.x.toFixed(2)} ${a1.y.toFixed(2)} A ${rArc} ${rArc} 0 0 0 ${a2.x.toFixed(2)} ${a2.y.toFixed(2)}`);
    const pmArc=pt(thm,rArc+15);
    dthTxt.setAttribute('x',pmArc.x); dthTxt.setAttribute('y',pmArc.y+4);
    dthTxt.textContent='dθ';

    /* Pull offset */
    const ux=Math.cos(thm), uy=-Math.sin(thm);
    const PULL_DIST=85;
    wrap.style.transform=st.pull?`translate(${ux*PULL_DIST}px,${uy*PULL_DIST}px)`:'translate(0,0)';
    gDim.setAttribute('opacity',st.pull?1:0);

    /* Dimensions on pulled sector */
    const pRimM=pt(thm,R+18);
    dimBaseTxt.setAttribute('x',pRimM.x+ux*10); dimBaseTxt.setAttribute('y',pRimM.y+uy*10+4);
    dimBaseTxt.textContent=`base ≈ R·dθ`;

    const pRadM=pt(th1,R*.55);
    dimRadTxt.setAttribute('x',pRadM.x-uy*18); dimRadTxt.setAttribute('y',pRadM.y+ux*18);
    dimRadTxt.textContent='height = R';

    const pForm=pt(thm,R+46);
    formulaTxt.setAttribute('x',pForm.x+ux*8); formulaTxt.setAttribute('y',pForm.y+uy*8+4);
    formulaTxt.textContent='dA = ½ R² dθ';

    note.style.opacity=st.pull?1:0;

    cArc.setAttribute('d',`M ${780-baseW/2} 290 Q 780 ${290+baseW*0.12} ${780+baseW/2} 290`);

    ctx.readout([
      ['element angle θ', `${(thm*180/Math.PI).toFixed(1)}° = ${thm.toFixed(3)} rad`],
      ['angular width dθ', `2π/${st.N} ≈ ${dth.toFixed(3)} rad (${(dth*180/Math.PI).toFixed(1)}°)`],
      ['arc base R·dθ', `${dth.toFixed(3)} R`],
      ['straight chord base', `${chordLen.toFixed(3)} R`],
      ['element dA', `½ R² dθ ≈ ${dA.toFixed(3)} R²`],
      ['area check', '∫₀²ᵖ ½ R² dθ = π R² ≈ 3.142 R²']]);
  }

  buildGhosts(); render();
  ctx.caption('fig. 07 — circular disc · element: triangular sector ½ R² dθ');
  ctx.legend([{c:'var(--teal)',t:'body (disc)'},{c:'var(--amber)',t:'element sector'},{c:'var(--coral)',t:'rim base R dθ'},{c:'rgba(233,242,234,.35)',t:'ghost sectors'}]);

  const sPos=makeSlider(controlsBar,{label:'angle θ',min:0,max:1,step:.001,value:st.th,
    fmt:v=>(v*(2*Math.PI-2*Math.PI/st.N)).toFixed(2)+' rad', onInput:v=>{st.th=v;render();}});
  makeSlider(controlsBar,{label:'sectors N',min:6,max:36,step:1,value:st.N,
    fmt:v=>'N = '+v, onInput:v=>{st.N=v;buildGhosts();render();}});
  makeToggle(controlsBar,{label:'ghost sectors',value:true,onInput:v=>{st.ghosts=v;render();}});
  makeToggle(controlsBar,{label:'straight chord (Δ)',value:false,onInput:v=>{st.chord=v;render();}});
  makeToggle(controlsBar,{label:'pull sector out',value:false,onInput:v=>{st.pull=v;render();}});
  ctx.sweepDur=5;
  ctx.setSweep(t=>{st.th=t;sPos.set(t);render();});
  return {dispose(){stopSweep();}};
}

/* ============================================================================

function discArcEdgeFactory(ctx){

  const triTxtOQ=svgEl('text',{class:'monoTxt',fill:'var(--coral)','font-size':13,'text-anchor':'middle'},gTri); triTxtOQ.textContent='R';
  const triTxtPQ=svgEl('text',{class:'monoTxt',fill:'var(--sky)','font-size':13,'text-anchor':'middle'},gTri);
  const triEq=svgEl('text',{x:180,y:100,class:'monoTxt',fill:'var(--coral)','font-size':12.5},gTri);
  triEq.textContent='ΔPOQ is isosceles (PO = OQ = R)';
  const triEq2=svgEl('text',{x:180,y:120,class:'monoTxt',fill:'var(--sky)','font-size':12.5},gTri);
  triEq2.textContent='⇒ cos φ = (r/2)/R = r/(2R)';

  /* Active Arc Element */

  const elStrip=svgEl('path',{fill:'rgba(255,184,77,.75)',stroke:'var(--amber)','stroke-width':1.4,filter:'url(#glowEdgeArc)',class:'elPulse'},wrap);

  const rayP=svgEl('line',{stroke:'var(--amber)','stroke-width':1.2,'stroke-dasharray':'4 4',opacity:.7},wrap);
  const phiArc=svgEl('path',{fill:'none',stroke:'var(--sky)','stroke-width':1.4},wrap);
  const phiTxt=svgEl('text',{class:'monoTxt',fill:'var(--sky)','font-size':12},wrap); phiTxt.textContent='φ';

  /* Pull-out unrolled strip on right side */
  const gPull=svgEl('g',{opacity:0},svg);
  gPull.style.transition='opacity .6s';
  const pStrip=svgEl('rect',{fill:'rgba(255,184,77,.7)',stroke:'var(--amber)','stroke-width':1.5},gPull);
  const pLenBrk=svgEl('line',{stroke:'var(--amber)','stroke-width':1.4,'marker-start':'url(#arrAs)','marker-end':'url(#arrA)'},gPull);
  const pLenTxt=svgEl('text',{class:'amberTxt','font-size':13,'text-anchor':'middle'},gPull);
  const pWidBrk=svgEl('line',{stroke:'var(--amber)','stroke-width':1.4,'marker-start':'url(#arrAs)','marker-end':'url(#arrA)'},gPull);

  const st={u:.5,N:28,ghosts:true,tri:false,pull:false};

  function getArcGeom(rad){
    const u_val=clamp(rad/(2*R),0.001,0.999);
    const phi=Math.acos(u_val);
    const xq=PX+rad*Math.cos(phi);
    const yq=rad*Math.sin(phi);
    return {rad,phi,q1:{x:xq,y:CY+yq},q2:{x:xq,y:CY-yq}};
  }

  function buildGhosts(){
    gGhost.innerHTML='';
    for(let i=1;i<st.N;i++){
      const rad=i*(2*R)/st.N;
      const {q1,q2}=getArcGeom(rad);
      svgEl('path',{d:`M ${q2.x.toFixed(2)} ${q2.y.toFixed(2)} A ${rad} ${rad} 0 0 1 ${q1.x.toFixed(2)} ${q1.y.toFixed(2)}`,

    }
  }

  function render(){
    const dr=(2*R)/st.N;
    const rCurr=clamp(st.u*2*R,dr*0.6,2*R-dr*0.6);
    const r1=Math.max(1,rCurr-dr/2), r2=Math.min(2*R-0.5,rCurr+dr/2);

    const gC=getArcGeom(rCurr), g1=getArcGeom(r1), g2=getArcGeom(r2);

    /* Center arc */
    elArcCenter.setAttribute('d',`M ${gC.q2.x.toFixed(2)} ${gC.q2.y.toFixed(2)} A ${rCurr} ${rCurr} 0 0 1 ${gC.q1.x.toFixed(2)} ${gC.q1.y.toFixed(2)}`);

      `A ${r2} ${r2} 0 0 1 ${g2.q1.x.toFixed(2)} ${g2.q1.y.toFixed(2)} `+
      `L ${g1.q1.x.toFixed(2)} ${g1.q1.y.toFixed(2)} `+
      `A ${r1} ${r1} 0 0 0 ${g1.q2.x.toFixed(2)} ${g1.q2.y.toFixed(2)} Z`;
    elStrip.setAttribute('d',stripD);

    /* Accumulated region */
    accPath.setAttribute('d',`M ${gC.q2.x.toFixed(2)} ${gC.q2.y.toFixed(2)} `+
      `A ${rCurr} ${rCurr} 0 0 1 ${gC.q1.x.toFixed(2)} ${gC.q1.y.toFixed(2)} `+
      `A ${R} ${R} 0 0 1 ${gC.q2.x.toFixed(2)} ${gC.q2.y.toFixed(2)} Z`);

    /* Endpoints */
    ptQ1.setAttribute('cx',gC.q1.x); ptQ1.setAttribute('cy',gC.q1.y);
    ptQ2.setAttribute('cx',gC.q2.x); ptQ2.setAttribute('cy',gC.q2.y);

    /* Radius ray from P to top endpoint */
    rayP.setAttribute('x1',PX); rayP.setAttribute('y1',PY);
    rayP.setAttribute('x2',gC.q2.x); rayP.setAttribute('y2',gC.q2.y);

    /* Angle arc for φ */
    const aR=Math.min(rCurr*0.5,45);
    phiArc.setAttribute('d',`M ${PX+aR} ${PY} A ${aR} ${aR} 0 0 0 ${(PX+aR*Math.cos(gC.phi)).toFixed(2)} ${(PY-aR*Math.sin(gC.phi)).toFixed(2)}`);
    phiTxt.setAttribute('x',PX+aR+8); phiTxt.setAttribute('y',PY-8);

    /* Geometric triangle ΔPOQ */
    triOQ.setAttribute('x1',CX); triOQ.setAttribute('y1',CY);
    triOQ.setAttribute('x2',gC.q2.x); triOQ.setAttribute('y2',gC.q2.y);
    triPQ.setAttribute('x1',PX); triPQ.setAttribute('y1',PY);
    triPQ.setAttribute('x2',gC.q2.x); triPQ.setAttribute('y2',gC.q2.y);
    const mx=(PX+gC.q2.x)/2, my=(PY+gC.q2.y)/2;
    altOM.setAttribute('x1',CX); altOM.setAttribute('y1',CY);
    altOM.setAttribute('x2',mx); altOM.setAttribute('y2',my);
    triTxtOQ.setAttribute('x',(CX+gC.q2.x)/2+12); triTxtOQ.setAttribute('y',(CY+gC.q2.y)/2);
    triTxtPQ.setAttribute('x',mx-14); triTxtPQ.setAttribute('y',my-10);
    triTxtPQ.textContent=`r = ${(rCurr/R).toFixed(2)} R`;
    gTri.setAttribute('opacity',st.tri?1:0);

    /* Pull arc out & show unrolled strip */
    wrap.style.transform=st.pull?'translate(0,-30px)':'translate(0,0)';
    gPull.setAttribute('opacity',st.pull?1:0);

    const sLen=2*rCurr*gC.phi;
    const sLenScaled=Math.min(260,sLen*0.75), sDrScaled=Math.max(4,dr*0.75);
    const px0=680, py0=240;
    pStrip.setAttribute('x',px0-sLenScaled/2); pStrip.setAttribute('y',py0-sDrScaled/2);
    pStrip.setAttribute('width',sLenScaled); pStrip.setAttribute('height',sDrScaled);

    pLenBrk.setAttribute('x1',px0-sLenScaled/2); pLenBrk.setAttribute('x2',px0+sLenScaled/2);
    pLenBrk.setAttribute('y1',py0+sDrScaled/2+18); pLenBrk.setAttribute('y2',py0+sDrScaled/2+18);
    pLenTxt.setAttribute('x',px0); pLenTxt.setAttribute('y',py0+sDrScaled/2+35);
    pLenTxt.textContent=`length = 2r arccos(r/2R) ≈ ${(sLen/R).toFixed(2)} R`;

    pWidBrk.setAttribute('x1',px0+sLenScaled/2+14); pWidBrk.setAttribute('x2',px0+sLenScaled/2+14);
    pWidBrk.setAttribute('y1',py0-sDrScaled/2); pWidBrk.setAttribute('y2',py0+sDrScaled/2);
    pWidTxt.setAttribute('x',px0+sLenScaled/2+22); pWidTxt.setAttribute('y',py0+4);
    pWidTxt.textContent='dr';

    pCap.setAttribute('x',px0); pCap.setAttribute('y',py0-sDrScaled/2-24);
    pForm.setAttribute('x',px0); pForm.setAttribute('y',py0+sDrScaled/2+62);

    note.style.opacity=st.pull?1:0;
    gGhost.style.opacity=(st.ghosts&&!st.pull)?1:0;
    gGhost.style.transition='opacity .5s';

    const rU=rCurr/R, drU=dr/R, dA=(sLen/R)*drU;
    ctx.readout([
      ['arc radius r', `${rU.toFixed(2)} R  (r ∈ [0, 2R])`],
      ['half-angle φ', `arccos(r/2R) = ${(gC.phi*180/Math.PI).toFixed(1)}° (${gC.phi.toFixed(3)} rad)`],
      ['arc span 2φ', `${(2*gC.phi*180/Math.PI).toFixed(1)}° (${(2*gC.phi).toFixed(3)} rad)`],
      ['arc length s(r)', `2r arccos(r/2R) ≈ ${(sLen/R).toFixed(3)} R`],
      ['thickness dr', `2R/${st.N} ≈ ${drU.toFixed(3)} R`],
      ['element dA', `s(r)·dr ≈ ${dA.toFixed(3)} R²`],
      ['area check', '∫₀²ᴿ 2r arccos(r/2R) dr = π R² ≈ 3.142 R²']]);
  }

  buildGhosts(); render();
  ctx.caption('fig. 08 — circular disc · element: edge-centered arc  s(r)·dr');
  ctx.legend([{c:'var(--teal)',t:'body (disc)'},{c:'var(--amber)',t:'element arc strip'},{c:'var(--coral)',t:'boundary endpoints'},{c:'rgba(233,242,234,.35)',t:'ghost arcs'}]);

  const sPos=makeSlider(controlsBar,{label:'radius r',min:0.03,max:0.97,step:.001,value:st.u,
    fmt:v=>(v*2).toFixed(2)+' R', onInput:v=>{st.u=v;render();}});

  makeToggle(controlsBar,{label:'ghost arcs',value:true,onInput:v=>{st.ghosts=v;render();}});

  makeToggle(controlsBar,{label:'pull arc out',value:false,onInput:v=>{st.pull=v;render();}});
  ctx.sweepDur=5;
  ctx.setSweep(t=>{st.u=t;sPos.set(t);render();});
  return {dispose(){stopSweep();}};

  const rim=new THREE.DirectionalLight(0x67e0c2,.5); rim.position.set(-4,-2,-3); scene.add(rim);

  const plane=new THREE.Plane(new THREE.Vector3(0,0,-1),0);
  const clipMats=[]; const clip=m=>{clipMats.push(m);return m;};

  const shellMat=clip(new THREE.MeshPhongMaterial({color:0xffb84d,emissive:0x6b420c,
    transparent:true,opacity:.95,side:THREE.DoubleSide,shininess:60}));
  const shell=new THREE.Mesh(new THREE.SphereGeometry(1,64,40),shellMat); peelGroup.add(shell);

  const ghostGroup=new THREE.Group(); scene.add(ghostGroup);

  const DIR=new THREE.Vector3(.62,.6,.5).normalize();      // radius direction
  const DDIR=new THREE.Vector3(.18,.95,.25).normalize();   // dr-gauge direction
  const mkLine=c=>{const l=new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),
    new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.9}));
    scene.add(l);return l;};
  const radLine=mkLine(0xf4f1e4), drLine=mkLine(0xff8a70);
  const conn=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),
    new THREE.LineDashedMaterial({color:0xf4f1e4,dashSize:.08,gapSize:.06,transparent:true,opacity:.55}));
  conn.visible=false; scene.add(conn);

  /* HTML labels projected from 3D */
  function makeLabel(html,big){const d=el('div','lbl3'+(big?' big':''),html);
    mount.appendChild(d);return{el:d,pos:new THREE.Vector3(),op:1};}
  const labR=makeLabel('r'), labDr=makeLabel('dr'), labShell=makeLabel('dV = 4πr²·dr',true);
  const labels=[labR,labDr,labShell];

  const st={r:.6,N:12,cut:false,ghosts:true,peel:false};
  const dr=()=>1/st.N;

  function buildGhosts(){
    ghostGroup.children.forEach(c=>{c.geometry.dispose();c.material.dispose();});
    ghostGroup.clear();
    for(let i=1;i<st.N;i++){
      const m=new THREE.MeshBasicMaterial({color:0x67e0c2,transparent:true,opacity:.07,depthWrite:false});
      if(st.cut)m.clippingPlanes=[plane];
      const g=new THREE.Mesh(new THREE.SphereGeometry(1,30,18),m);
      g.scale.setScalar(i/st.N); ghostGroup.add(g);}
  }
  function setLine(l,a,b){l.geometry.setFromPoints([a,b]);}
  function applyR(){
    const d=dr(), shellR=Math.min(st.r+d/2,.995), coreR=Math.max(st.r-d/2,.02);
    shell.scale.setScalar(shellR); core.scale.setScalar(coreR);
    setLine(radLine,new THREE.Vector3(),DIR.clone().multiplyScalar(shellR));
    setLine(drLine,DDIR.clone().multiplyScalar(shellR-d/2),DDIR.clone().multiplyScalar(shellR+d/2));
    labR.pos.copy(DIR).multiplyScalar(shellR*.55);
    labDr.pos.copy(DDIR).multiplyScalar(shellR+d/2+.09);
    labShell.pos.set(peelGroup.position.x,shellR+.26,0);
    const A=4*Math.PI*st.r*st.r, dV=A*d;
    ctx.readout([
      ['shell radius r', st.r.toFixed(2)+' R'],
      ['thickness dr', `R/${st.N} ≈ ${d.toFixed(3)} R`],
      ['shell area 4πr²', A.toFixed(2)+' R²'],
      ['element dV', dV.toFixed(3)+' R³']]);
  }
  function updateConn(){
    const x=peelGroup.position.x;
    conn.visible=st.peel&&x>.25;
    if(conn.visible){
      conn.geometry.setFromPoints([new THREE.Vector3(1.03,0,0),
        new THREE.Vector3(x-shell.scale.x-.06,0,0)]);
      conn.computeLineDistances();}
    labShell.pos.set(x,shell.scale.x+.26,0);
  }
  function applyCut(){
    clipMats.forEach(m=>{m.clippingPlanes=st.cut?[plane]:null;m.needsUpdate=true;});
    ghostGroup.children.forEach(g=>{g.material.clippingPlanes=st.cut?[plane]:null;g.material.needsUpdate=true;});
  }

  buildGhosts(); applyR();
  ctx.caption('fig. 09 — solid sphere · element: hollow shell  (drag to orbit)');
  ctx.legend([{c:'rgba(143,227,204,.6)',t:'body'},{c:'var(--amber)',t:'element shell'},
    {c:'rgba(103,224,194,.5)',t:'ghost shells'},{c:'var(--chalk)',t:'∫ done (core)'}]);

  stage.start(t=>{
    shellMat.emissiveIntensity=.6+.3*Math.sin(t*2.4);
    if(st.peel)shell.rotation.y=t*.4;
    labels.forEach(L=>{
      const v=L.pos.clone().project(camera);
      const w=mount.clientWidth,h=mount.clientHeight;
      L.el.style.transform=`translate(-50%,-50%) translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px)`;
      L.el.style.opacity=(v.z<1?L.op:0);});
  });

  const sliders=[];
  sliders.push(makeSlider(controlsBar,{label:'radius r',min:.12,max:1,step:.005,value:st.r,
    fmt:v=>v.toFixed(2)+' R', onInput:v=>{st.r=v;applyR();}}));
  makeSlider(controlsBar,{label:'shells N',min:4,max:12,step:1,value:st.N,
    fmt:v=>'N = '+v, onInput:v=>{st.N=v;buildGhosts();applyR();}});
  makeToggle(controlsBar,{label:'cutaway',value:false,onInput:v=>{st.cut=v;applyCut();}});
  makeToggle(controlsBar,{label:'ghost shells',value:true,onInput:v=>{st.ghosts=v;ghostGroup.visible=v;}});
  makeToggle(controlsBar,{label:'peel shell off',value:false,onInput:v=>{
    st.peel=v; labShell.op=v?1:0;
    gsap.to(peelGroup.position,{x:v?2.05:0,duration:1,ease:'power3.inOut',onUpdate:updateConn});}});
  ctx.sweepDur=5;
  ctx.setSweep(t=>{const v=lerp(.12,1,t); st.r=v; sliders[0].set(v); applyR();});

  return {dispose(){gsap.killTweensOf(peelGroup.position);stopSweep();stage.dispose();}};
}

/* ============================================================================
   MODULE 10 — SOLID SPHERE (DISC SLICES, dV = π (R² - y²) dy)
   ========================================================================== */
function sphereDiscFactory(ctx){
  const stage=threeStage(mount);
  if(!stage){mount.appendChild(el('div','queuedCard','<p class="qNote">WebGL unavailable — 3D module cannot start.</p>'));return {};}
  const {scene,camera,controls}=stage;
  stdLights(scene);
  controls.target.set(0,0,0); camera.position.set(2.9,1.9,3.3);

  /* Translucent outer sphere (radius R = 1) */
  const outerMat=new THREE.MeshPhongMaterial({color:0x8fe3cc,transparent:true,opacity:.10,
    side:THREE.DoubleSide,depthWrite:false,shininess:70});
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1,72,48),outerMat));
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.001,26,16),
    new THREE.MeshBasicMaterial({color:0x67e0c2,wireframe:true,transparent:true,opacity:.05})));

  /* Vertical axis along y (from -1.35 to +1.35) */
  const dashM=new THREE.LineDashedMaterial({color:0xf4f1e4,dashSize:.07,gapSize:.05,transparent:true,opacity:.55});
  const axis=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(0,-1.35,0),new THREE.Vector3(0,1.35,0)]),dashM);
  axis.computeLineDistances(); scene.add(axis);

  /* Equator circle guide */
  const eq=[]; for(let i=0;i<=72;i++){const a=i/72*Math.PI*2; eq.push(new THREE.Vector3(Math.cos(a),0,Math.sin(a)));}
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(eq),
    new THREE.LineBasicMaterial({color:0xf4f1e4,transparent:true,opacity:.2})));

  const ghostGroup=new THREE.Group(); scene.add(ghostGroup);
  const coreGroup=new THREE.Group(); scene.add(coreGroup);
  const peelGroup=new THREE.Group(); scene.add(peelGroup);

  /* Element Disc Mesh (Unit Cylinder, scaled to rho, dy, rho) */
  const discMat=new THREE.MeshPhongMaterial({color:0xffb84d,emissive:0x6b420c,
    transparent:true,opacity:.95,side:THREE.DoubleSide,shininess:50});
  const discMesh=new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,64),discMat);
  peelGroup.add(discMesh);

  /* Disc rim wireframe */
  const rimWire=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.CylinderGeometry(1,1,1,36,1)),
    new THREE.LineBasicMaterial({color:0xffd99a,transparent:true,opacity:.75}));
  peelGroup.add(rimWire);

  /* 3D Geometric guides: Right Triangle (Hypotenuse R, Vertical y, Horizontal rho) */
  const mkLine=(c,dashed)=>{const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    [new THREE.Vector3(),new THREE.Vector3()]),
    dashed?new THREE.LineDashedMaterial({color:c,dashSize:.06,gapSize:.04,transparent:true,opacity:.75})
          :new THREE.LineBasicMaterial({color:c,transparent:true,opacity:.9}));
    if(dashed)l.computeLineDistances(); scene.add(l); return l;};

  const lineHypR=mkLine(0xff8a70), lineLegRho=mkLine(0x8ecbff),
    lineLegY=mkLine(0xf4f1e4), lineDyGauge=mkLine(0xffb84d);
  const conn=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),
    new THREE.LineDashedMaterial({color:0xf4f1e4,dashSize:.07,gapSize:.05,transparent:true,opacity:.55}));
  conn.computeLineDistances(); scene.add(conn);

  const LF=labelFactory(mount);
  const labY=LF.make('y'), labRho=LF.make('r(y) = √(R²−y²)'), labR=LF.make('R'),
    labDy=LF.make('dy'), labDisc=LF.make('dV = π(R²−y²) dy',true);

  const st={s:.6,N:24,ghosts:true,tri:true,pull:false};
  const dy=()=>2/st.N;

  function buildGhosts(){
    ghostGroup.children.forEach(c=>{c.geometry.dispose();c.material.dispose();});
    ghostGroup.clear();
    const d=dy();
    for(let i=1;i<st.N;i++){
      const yi=-1+i*d, r=Math.sqrt(Math.max(0,1-yi*yi)), pts=[];
      for(let k=0;k<=72;k++){const a=k/72*Math.PI*2;
        pts.push(new THREE.Vector3(r*Math.cos(a),yi,r*Math.sin(a)));}
      ghostGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:0x67e0c2,transparent:true,opacity:.22})));
    }
  }

  function buildCore(yCurrent){
    coreGroup.children.forEach(c=>{c.geometry.dispose();c.material.dispose();});
    coreGroup.clear();
    const d=dy();
    for(let i=0;i<st.N;i++){
      const yi=-1+i*d+d/2;
      if(yi>yCurrent) break;
      const r=Math.sqrt(Math.max(0.001,1-yi*yi));
      const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d,40),
        new THREE.MeshPhongMaterial({color:0x1d574b,transparent:true,opacity:.45,depthWrite:false,shininess:20}));
      m.position.y=yi; coreGroup.add(m);
    }
  }

  function applyAll(){
    const d=dy();
    const y=-1+d/2+st.s*(2-d);
    const rho=Math.sqrt(Math.max(0.001,1-y*y));

    discMesh.scale.set(rho,d,rho); discMesh.position.y=y;
    rimWire.scale.set(rho,d,rho); rimWire.position.y=y;

    buildCore(y-d/2);

    /* Guides for right triangle in xy plane: (0,0) -> (0,y) -> (rho,y) -> (0,0) */
    setPts(lineHypR,new THREE.Vector3(0,0,0),new THREE.Vector3(rho,y,0));
    setPts(lineLegY,new THREE.Vector3(0,0,0),new THREE.Vector3(0,y,0));
    setPts(lineLegRho,new THREE.Vector3(0,y,0),new THREE.Vector3(rho,y,0));
    setPts(lineDyGauge,new THREE.Vector3(rho+.08,y-d/2,0),new THREE.Vector3(rho+.08,y+d/2,0));

    const triVis=st.tri?1:0;
    lineHypR.visible=!!triVis; lineLegY.visible=!!triVis; lineLegRho.visible=!!triVis;

    /* Pull connector */
    const pxv=peelGroup.position.x;
    setPts(conn,new THREE.Vector3(rho,y,0),new THREE.Vector3(pxv-rho-.05,y,0));
    conn.visible=st.pull&&pxv>.25;

    /* Labels */
    labY.pos.set(-.08,y/2,0);
    labRho.pos.set(rho*.5,y+.09,0);
    labR.pos.set(rho*.45,y*.45+.08,0);
    labDy.pos.set(rho+.18,y,0);
    labDisc.pos.set(pxv,y+rho*.5+.28,0);

    const dV=Math.PI*rho*rho*d;
    ctx.readout([
      ['slice height y', `${y.toFixed(2)} R  (y ∈ [−R, +R])`],
      ['thickness dy', `2R/${st.N} ≈ ${d.toFixed(3)} R`],
      ['disc radius r(y)', `√(R²−y²) ≈ ${rho.toFixed(3)} R`],
      ['disc area π·r²', `π(R²−y²) ≈ ${(Math.PI*rho*rho).toFixed(3)} R²`],
      ['element dV', `π(R²−y²) dy ≈ ${dV.toFixed(3)} R³`],
      ['volume check', '∫₋ᵣ⁺ᵣ π(R²−y²) dy = ⁴⁄₃ πR³ ≈ 4.189 R³']]);
  }

  buildGhosts(); applyAll();

  ctx.caption('fig. 10 — solid sphere · element: thin disc slice  (drag to orbit)');
  ctx.legend([{c:'rgba(143,227,204,.6)',t:'sphere'},{c:'var(--amber)',t:'element disc'},
    {c:'var(--chalk)',t:'∫ done (stack)'},{c:'var(--sky)',t:'radius r(y)'}]);

  stage.start(t=>{
    discMat.emissiveIntensity=.6+.3*Math.sin(t*2.4);
    if(st.pull)discMesh.rotation.y=t*.4;
    LF.update(camera);
  });

  const sPos=makeSlider(controlsBar,{label:'height y',min:0,max:1,step:.001,value:st.s,
    fmt:v=>(-1+dy()/2+v*(2-dy())).toFixed(2)+' R', onInput:v=>{st.s=v;applyAll();}});
  makeSlider(controlsBar,{label:'discs N',min:4,max:24,step:1,value:st.N,
    fmt:v=>'N = '+v, onInput:v=>{st.N=v;buildGhosts();applyAll();}});
  makeToggle(controlsBar,{label:'ghost discs',value:true,onInput:v=>{st.ghosts=v;ghostGroup.visible=v;}});
  makeToggle(controlsBar,{label:'triangle (R, y, r)',value:true,onInput:v=>{st.tri=v;applyAll();}});
  makeToggle(controlsBar,{label:'pull disc out',value:false,onInput:v=>{
    st.pull=v; labDisc.op=v?1:0;
    gsap.killTweensOf(peelGroup.position);
    gsap.to(peelGroup.position,{x:v?1.85:0,duration:1,ease:'power3.inOut',onUpdate:applyAll});}});
  ctx.sweepDur=5;
  ctx.setSweep(t=>{st.s=t;sPos.set(t);applyAll();});
  return {dispose(){gsap.killTweensOf(peelGroup.position);stopSweep();stage.dispose();}};
}

/* ---------- MODULE 02 — CIRCULAR ARC (element ds = R dθ) ---------- */
function arcFactory(ctx){
  const W=960,H=470,CX=430,CY=262,R=186;
  const TH1=10*Math.PI/180, TH2=170*Math.PI/180, SPAN=TH2-TH1;
  const pt=(th,r)=>({x:CX+r*Math.cos(th), y:CY-r*Math.sin(th)});
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'xMidYMid meet',class:'fig'},mount);
  const defs=svgEl('defs',{},svg);
  defs.innerHTML=
   `<filter id="glowArc" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#ffb84d"/></marker>
    <marker id="arrAs" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8,0L0,4L8,8z" fill="#ffb84d"/></marker>`;
  const arcA=(r,a0,a1,n=64)=>{let d='';for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,p=pt(a,r);
    d+=(i?'L':'M')+p.x.toFixed(2)+' '+p.y.toFixed(2);}return d;};

  /* static scenery */
  svgEl('circle',{cx:CX,cy:CY,r:R,fill:'none',stroke:'var(--teal)','stroke-dasharray':'3 7','stroke-width':1.2,opacity:.3},svg);
  const p1=pt(TH1,R),p2=pt(TH2,R);
  svgEl('line',{x1:CX,y1:CY,x2:p1.x,y2:p1.y,class:'faintLn'},svg);
  svgEl('text',{x:p1.x+14,y:p1.y+22,class:'monoTxt','font-size':13},svg).textContent='θ₁';
  svgEl('text',{x:p2.x-34,y:p2.y+22,class:'monoTxt','font-size':13},svg).textContent='θ₂';
  svgEl('path',{d:arcA(R,TH1,TH2),fill:'none',stroke:'var(--teal)','stroke-width':8,'stroke-linecap':'round',opacity:.85},svg);
  svgEl('circle',{cx:p1.x,cy:p1.y,r:5.5,fill:'var(--chalk)'},svg);
  svgEl('circle',{cx:p2.x,cy:p2.y,r:5.5,fill:'var(--chalk)'},svg);
  svgEl('circle',{cx:CX,cy:CY,r:4,fill:'var(--chalk)'},svg);
  svgEl('text',{x:CX-6,y:CY+24,class:'monoTxt','font-size':13},svg).textContent='O';

  const gGhost=svgEl('g',{},svg);
  const angArc=svgEl('path',{fill:'none',stroke:'var(--chalk)','stroke-width':1.3,opacity:.55},svg);
  const angTxt=svgEl('text',{class:'chalkTxt','font-size':15},svg); angTxt.textContent='θ';
  const radLn=svgEl('line',{x1:CX,y1:CY,stroke:'var(--chalk)','stroke-width':1.3,opacity:.75},svg);
  const radTxt=svgEl('text',{class:'chalkTxt','font-size':15},svg); radTxt.textContent='R';

  /* element wrapper (lifts radially when pulled) */
  const wrap=svgEl('g',{},svg);
  wrap.style.transition='transform .8s cubic-bezier(.2,.75,.2,1)';
  const elArc=svgEl('path',{fill:'none',stroke:'var(--amber)','stroke-width':12,'stroke-linecap':'round',filter:'url(#glowArc)',class:'elPulse'},wrap);
  const tick1=svgEl('line',{stroke:'var(--chalk)','stroke-width':2},wrap);
  const tick2=svgEl('line',{stroke:'var(--chalk)','stroke-width':2},wrap);
  const dthArc=svgEl('path',{fill:'none',stroke:'var(--amber)','stroke-width':1.4},wrap);
  const dthTxt=svgEl('text',{class:'amberTxt','font-size':14,'text-anchor':'middle'},wrap); dthTxt.textContent='dθ';
  const gPull=svgEl('g',{opacity:0},wrap);
  const dsTxt=svgEl('text',{class:'amberTxt','font-size':15,'text-anchor':'middle'},gPull);
  const note=svgEl('text',{x:W/2,y:52,class:'bigNote','text-anchor':'middle'},svg);
  note.textContent='the radius is frozen — the only coordinate left is the angle θ';

  const st={s:.35,N:36,ghosts:true,pull:false};
  function buildGhosts(){
    gGhost.innerHTML=''; const dth=SPAN/st.N;
    for(let i=0;i<=st.N;i++){const a=TH1+i*dth,q1=pt(a,R-13),q2=pt(a,R+13);
      svgEl('line',{x1:q1.x,y1:q1.y,x2:q2.x,y2:q2.y,stroke:'var(--teal)','stroke-width':1.4,opacity:.35},gGhost);}
  }
  function render(){
    const dth=SPAN/st.N, the=TH1+st.s*(SPAN-dth), thm=the+dth/2;
    elArc.setAttribute('d',arcA(R,the,the+dth));
    [ [tick1,the],[tick2,the+dth] ].forEach(([tk,a])=>{const q1=pt(a,R-15),q2=pt(a,R+15);
      tk.setAttribute('x1',q1.x);tk.setAttribute('y1',q1.y);tk.setAttribute('x2',q2.x);tk.setAttribute('y2',q2.y);});
    dthArc.setAttribute('d',arcA(R+26,the,the+dth,24));
    const pd=pt(thm,R+46); dthTxt.setAttribute('x',pd.x); dthTxt.setAttribute('y',pd.y+5);
    angArc.setAttribute('d',arcA(44,TH1,thm,32));
    const pt2=pt((TH1+thm)/2,64); angTxt.setAttribute('x',pt2.x-5); angTxt.setAttribute('y',pt2.y+5);
    const pm=pt(thm,R); radLn.setAttribute('x2',pm.x); radLn.setAttribute('y2',pm.y);
    const pr=pt(thm,R*.55); radTxt.setAttribute('x',pr.x+8); radTxt.setAttribute('y',pr.y-8);
    const u={x:Math.cos(thm),y:-Math.sin(thm)};
    wrap.style.transform=st.pull?`translate(${u.x*80}px,${u.y*80}px)`:'translate(0,0)';
    gPull.setAttribute('opacity',st.pull?1:0);
    const ds=pt(thm,R+66); dsTxt.setAttribute('x',ds.x); dsTxt.setAttribute('y',ds.y+6);
    dsTxt.textContent=`ds = R·dθ ≈ ${dth.toFixed(3)} R`;
    note.style.opacity=st.pull?1:0;
    gGhost.style.transition='opacity .5s';
    gGhost.style.opacity=(st.ghosts&&!st.pull)?1:0;
    ctx.readout([
      ['element centre θ', `${(thm*180/Math.PI).toFixed(1)}° = ${thm.toFixed(3)} rad`],
      ['angular width dθ', `${(SPAN/st.N).toFixed(3)} rad = ${(SPAN*180/Math.PI/st.N).toFixed(1)}°`],
      ['element ds', `R·dθ ≈ ${(SPAN/st.N).toFixed(3)} R`],
      ['pieces total', st.N]]);
  }
  buildGhosts(); render();
  ctx.caption('fig. 02 — circular arc · element R dθ');
  ctx.legend([{c:'var(--teal)',t:'body (arc)'},{c:'var(--amber)',t:'element ds'},{c:'rgba(233,242,234,.35)',t:'ghost pieces'}]);

  const sPos=makeSlider(controlsBar,{label:'angle θ',min:0,max:1,step:.001,value:st.s,
    fmt:v=>(TH1+v*(SPAN-SPAN/st.N)).toFixed(2)+' rad', onInput:v=>{st.s=v;render();}});
  makeSlider(controlsBar,{label:'pieces N',min:6,max:36,step:1,value:st.N,
    fmt:v=>'N = '+v, onInput:v=>{st.N=v;buildGhosts();render();}});
  makeToggle(controlsBar,{label:'ghost pieces',value:true,onInput:v=>{st.ghosts=v;render();}});
  makeToggle(controlsBar,{label:'pull element out',value:false,onInput:v=>{st.pull=v;render();}});
  ctx.sweepDur=5;
  ctx.setSweep(t=>{st.s=t;sPos.set(t);render();});
  return {dispose(){stopSweep();}};
}

/* ---------- MODULE 03 — SMOOTH CURVE (element dℓ = √(dx²+dy²)) ---------- */
function curveFactory(ctx){
  const W=960,H=470,X0=140,X1=820,BASE=352,SY=64,SX=(X1-X0)/6;
  const f=x=>1.35*Math.sin(1.05*x)+1.5+0.12*x;
  const PX=x=>X0+x*SX, PY=y=>BASE-y*SY;
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'xMidYMid meet',class:'fig'},mount);
  const defs=svgEl('defs',{},svg);
  defs.innerHTML=
   `<filter id="glowC" x="-60%" y="-60%" width="220%" height="220%">

  const st={s:.3,N:40,ghosts:true,lens:true};

    const sg=Math.sign(P2.y-P1.y)||1;
    raM.setAttribute('d',`M ${Cpt.x-8} ${Cpt.y} L ${Cpt.x-8} ${Cpt.y+sg*8} L ${Cpt.x} ${Cpt.y+sg*8}`);
    dxTxt.setAttribute('x',(P1.x+Cpt.x)/2); dxTxt.setAttribute('y',P1.y+18);
    dyTxt.setAttribute('x',Cpt.x+12); dyTxt.setAttribute('y',(Cpt.y+P2.y)/2+4);
    const mx=(P1.x+P2.x)/2,my=(P1.y+P2.y)/2,ddx=P2.x-P1.x,ddy=P2.y-P1.y,
      L=Math.hypot(ddx,ddy)||1,nx=ddy/L,ny=-ddx/L;
    dlTxt.setAttribute('x',mx+nx*16); dlTxt.setAttribute('y',my+ny*16);
    /* lens mapping */

    const ZP=(px,py)=>({x:LC.x+(px-MX)*Z, y:LC.y+(py-MY)*Z});
    let zd=''; for(let i=0;i<=40;i++){const x=xa+(xb-xa)*i/40,q=ZP(PX(x),PY(f(x)));
      zd+=(i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1);}
    zCurve.setAttribute('d',zd);
    const z1=ZP(P1.x,P1.y),z2=ZP(P2.x,P2.y),zc=ZP(Cpt.x,Cpt.y);

    gLens.style.opacity=st.lens?1:0; conn.style.opacity=st.lens?.22:0;

    const dy=f(xb)-f(xa), dl=Math.hypot(dxU,dy);
    ctx.readout([

      ['dy', dy.toFixed(3)],
      ['element dℓ', `√(dx²+dy²) ≈ ${dl.toFixed(3)}`],
      ['slope dy/dx', (dy/dxU).toFixed(2)]]);
  }
  buildGhosts(); render();
  ctx.caption('fig. 03 — smooth curve · element dℓ = √(dx² + dy²)');
  ctx.legend([{c:'var(--teal)',t:'curve'},{c:'var(--amber)',t:'element dℓ'},{c:'var(--coral)',t:'dx, dy legs'}]);

  const sPos=makeSlider(controlsBar,{label:'position x',min:0,max:1,step:.001,value:st.s,
    fmt:v=>(v*(6-6/st.N)).toFixed(2), onInput:v=>{st.s=v;render();}});

  makeToggle(controlsBar,{label:'zoom lens ×9',value:true,onInput:v=>{st.lens=v;render();}});
  ctx.sweepDur=5;
  ctx.setSweep(t=>{st.s=t;sPos.set(t);render();});
  return {dispose(){stopSweep();}};
}

/* ---------- MODULE 05 — TRIANGLE (strip width set by similar triangles) ---------- */
function triFactory(ctx){
  const W=960,H=470,OX=210,OY=400,U=82,BU=6*U,HU=4*U;   /* base b=6, height h=4 */
  const wpx=y=>6*(1-y/4)*U;

    </filter>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#ffb84d"/></marker>
    <marker id="arrAs" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><path d="M8,0L0,4L8,8z" fill="#ffb84d"/></marker>

  svgEl('line',{x1:OX-26,y1:OY,x2:OX+BU+52,y2:OY,class:'axisLn','marker-end':'url(#arrC)'},svg);
  svgEl('line',{x1:OX,y1:OY+22,x2:OX,y2:OY-HU-34,class:'axisLn','marker-end':'url(#arrC)'},svg);
  svgEl('text',{x:OX+BU+48,y:OY+24,class:'monoTxt','font-size':13},svg).textContent='x';
  svgEl('text',{x:OX-30,y:OY-HU-28,class:'monoTxt','font-size':13},svg).textContent='y';
  svgEl('path',{d:`M ${OX} ${OY} L ${OX+BU} ${OY} L ${OX} ${OY-HU} Z`,
    fill:'rgba(103,224,194,.07)',stroke:'var(--teal)','stroke-width':2},svg);
  svgEl('text',{x:OX+BU/2,y:OY+28,class:'monoTxt','font-size':14,'text-anchor':'middle'},svg).textContent='b';
  svgEl('text',{x:OX-24,y:OY-HU/2+5,class:'monoTxt','font-size':14},svg).textContent='h';

  const gGhost=svgEl('g',{},svg);
  const gSim=svgEl('g',{opacity:0},svg);
  const simPath=svgEl('path',{fill:'none',stroke:'var(--coral)','stroke-width':1.6,'stroke-dasharray':'6 5'},gSim);
  const simV=svgEl('text',{class:'monoTxt','font-size':12.5,fill:'var(--coral)','text-anchor':'end'},gSim);
  const simW=svgEl('text',{class:'monoTxt','font-size':12.5,fill:'var(--coral)','text-anchor':'middle'},gSim);
  const simEq=svgEl('text',{x:742,y:150,class:'monoTxt','font-size':12.5},gSim);
  simEq.textContent='w(y)/b = (h−y)/h';
  const simEq2=svgEl('text',{x:742,y:170,class:'monoTxt','font-size':12.5},gSim);
  simEq2.textContent='⇒ w(y) = b(1−y/h)';

  const slot=svgEl('rect',{fill:'none',stroke:'var(--amber)','stroke-dasharray':'4 4',opacity:0},svg);
  const wrap=svgEl('g',{},svg);
  wrap.style.transition='transform .8s cubic-bezier(.2,.75,.2,1)';
  const strip=svgEl('rect',{fill:'rgba(255,184,77,.72)',stroke:'var(--amber)','stroke-width':2,filter:'url(#glowT)',class:'elPulse'},wrap);
  const gDim=svgEl('g',{opacity:0},wrap);
  const mkBr=(label)=>{
    const l=svgEl('line',{stroke:'var(--amber)','stroke-width':1.4,'marker-start':'url(#arrAs)','marker-end':'url(#arrA)'},gDim);
    const t=svgEl('text',{class:'amberTxt','font-size':13,'text-anchor':'middle'},gDim);t.textContent=label;return[l,t];};
  const [brW,brWt]=mkBr('w(y)'), [brH,brHt]=mkBr('dy');
  const fTxt=svgEl('text',{class:'amberTxt','font-size':15},gDim); fTxt.textContent='dA = w(y)·dy';
  const note=svgEl('text',{x:W/2,y:52,class:'bigNote','text-anchor':'middle'},svg);
  note.textContent='the strip width is not free — similar triangles decide it';

  const st={s:.35,N:26,ghosts:true,sim:false,pull:false};
  function buildGhosts(){
    gGhost.innerHTML='';
    for(let i=1;i<st.N;i++){const y=i*4/st.N;
      svgEl('line',{x1:OX,y1:OY-y*U,x2:OX+wpx(y),y2:OY-y*U,stroke:'var(--teal)','stroke-width':1.2,opacity:.3},gGhost);}

  function render(){

    gDim.setAttribute('opacity',st.pull?1:0);
    brW.setAttribute('x1',OX+88);brW.setAttribute('x2',OX+88+w);brW.setAttribute('y1',sy+dyp+16);brW.setAttribute('y2',sy+dyp+16);
    brWt.setAttribute('x',OX+88+w/2);brWt.setAttribute('y',sy+dyp+34);
    brH.setAttribute('x1',OX+w+88+16);brH.setAttribute('x2',OX+w+88+16);brH.setAttribute('y1',sy);brH.setAttribute('y2',sy+dyp);
    brHt.setAttribute('x',OX+w+88+38);brHt.setAttribute('y',sy+dyp/2+4);
    fTxt.setAttribute('x',OX+w+130);fTxt.setAttribute('y',sy+dyp/2+4);
    /* similar-triangles overlay (small upper triangle above the strip) */
    const yTop=yb+dyU, wTop=wpx(yTop);
    simPath.setAttribute('d',`M ${OX} ${OY-HU} L ${OX} ${OY-yTop*U} L ${OX+wTop} ${OY-yTop*U} Z`);
    simV.setAttribute('x',OX-12);simV.setAttribute('y',(OY-HU+OY-yTop*U)/2);simV.textContent='h−y';

    fmt:v=>(v*(4-4/st.N)).toFixed(2), onInput:v=>{st.s=v;render();}});
  makeSlider(controlsBar,{label:'strips N',min:4,max:26,step:1,value:st.N,
    fmt:v=>'N = '+v, onInput:v=>{st.N=v;buildGhosts();render();}});

  ctx.sweepDur=4.5;

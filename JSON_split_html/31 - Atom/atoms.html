<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>atoms.html</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Staatliches:wght@300;400;500;600;700;800&family=Commissioner:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
--bg: #061018;
  --accent: #67e8f9;
  --text: #ecfeff;
  --muted: #94a3b8;
  --glow: #f43f5e;
  --display: 'Staatliches', serif;
  --body: 'Commissioner', sans-serif;
  --mono: 'Commissioner', monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
}

/* Persistent 3D layer — OUTSIDE .page */
#canvas-wrap {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--glow) 13%, transparent), transparent 60%), var(--bg);
}
#canvas-wrap canvas { display: block; width: 100% !important; height: 100% !important; }
.vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 40%, color-mix(in srgb, var(--bg) 80%, transparent) 100%);
}

/* Single landing slide */
.page {
  position: relative; z-index: 2;
  height: 100%; box-sizing: border-box;
  overflow: hidden;
  background: transparent;
  color: var(--text);
  font-family: var(--body);
}
.wrap {
  height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 6vmin 7vw 8vmin;
  max-width: 72ch;
  position: relative; z-index: 2;
}
.chapter-badge {
  font-size: clamp(12px, 1.8vmin, 18px);
  letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 1.2vmin; display: block;
  animation: fadeUp 1s ease both;
}
.brand {
  font-family: var(--display);
  color: var(--text);
  text-shadow: 0 2px 40px var(--bg), 0 0 80px var(--bg);
  animation: fadeUp 1s 0.15s ease both;
  margin: 0;
}
.headline {
  animation: fadeUp 1s 0.3s ease both;
  margin: 0;
}
.tagline {
  margin-top: 1.6vmin; color: var(--muted);
  font-size: clamp(14px, 2.2vmin, 22px); max-width: 40ch;
  animation: fadeUp 1s 0.45s ease both;
}
.strip {
  display: flex; flex-wrap: wrap; gap: 1.2vmin;
  margin-top: 3.5vmin; max-width: 70ch;
  animation: fadeUp 1s 0.6s ease both;
}
.tag {
  padding: 1vmin 2vmin; border-radius: 999px;
  font-size: clamp(12px, 1.9vmin, 18px); font-weight: 600;
  color: var(--text);
  border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}
.hint {
  margin-top: 3vmin;
  font-size: clamp(12px, 1.8vmin, 16px);
  color: var(--muted); letter-spacing: 0.04em;
  animation: fadeUp 1s 0.75s ease both;
}

/* Per-chapter hero typography overrides */
.wrap { display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start; min-height:0;height:100%; padding:4rem 7vw 5rem; }
      .brand { font-size:clamp(4.5rem, 14vw, 11rem); line-height:0.85; text-transform:uppercase; letter-spacing:0.02em; color:var(--text); border-bottom:4px solid var(--accent); padding-bottom:0.4rem; }
      .headline { font-size:1.35rem; margin-top:1.4rem; max-width:28ch; color:var(--muted); }
      .chapter-badge { color:var(--glow); }
      
      

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
@media print {
  #canvas-wrap, .vignette, .hint { display: none !important; }
  .page { background: var(--bg) !important; }
  .chapter-badge, .brand, .headline, .tagline, .strip { opacity: 1 !important; transform: none !important; animation: none !important; }
}
</style>
</head>
<body>

<!-- Persistent background siblings (OUTSIDE .page) -->
<div id="canvas-wrap"></div>
<div class="vignette"></div>

<!-- ===== Single chapter landing slide ===== -->
<section class="page">
  <div class="wrap">
    <span class="chapter-badge">Class 12 · Chapter 12</span>
    <h1 class="brand">Atoms</h1>
    <p class="headline">The architecture of the atom</p>
    <p class="tagline">Rutherford. Bohr. Spectra.</p>
    <div class="strip">
        <span class="tag">Alpha-Particle Scattering</span>
        <span class="tag">Rutherford's Nuclear Model</span>
        <span class="tag">Bohr's Model of Hydrogen</span>
        <span class="tag">Energy Levels &amp; Spectra</span>
        <span class="tag">de Broglie's Explanation</span>
      </div>
    <p class="hint no-print">Press <b>Next</b> to begin the chapter</p>
  </div>
</section>

<script>
(function() {
  const ACCENT = 6809849;
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  function size(){
    const w = Math.max(wrap.clientWidth || innerWidth || 1, 1);
    const h = Math.max(wrap.clientHeight || innerHeight || 1, 1);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  size();
  wrap.appendChild(renderer.domElement);
  
      // Hydrogen energy levels + Balmer spectral emission — not planetary orbits
      const levels = [-5.4, -2.7, -1.35, -0.85, -0.54]; // visual y positions for n=1..5
      const levelBars = [];
      const labels = [];
      levels.forEach((y, i) => {
        const bar = new THREE.Mesh(
          new THREE.BoxGeometry(5.5 - i * 0.35, 0.06, 0.06),
          new THREE.MeshBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.55 + i * 0.08 })
        );
        bar.position.set(-1.5, y, 0);
        scene.add(bar);
        levelBars.push(bar);
      });
      // Vertical axis
      scene.add(new THREE.Mesh(
        new THREE.BoxGeometry(0.04, 7.2, 0.04),
        new THREE.MeshBasicMaterial({ color: 0x334155 })
      )).position.set(-4.5, -2.5, 0);

      // Balmer spectral lines (side panel) — violet, blue, cyan, red
      const balmer = [
        { color: 0xa855f7, x: 4.2 },
        { color: 0x3b82f6, x: 4.7 },
        { color: 0x22d3ee, x: 5.2 },
        { color: 0xf43f5e, x: 5.7 },
      ];
      const spectra = [];
      balmer.forEach((b) => {
        const line = new THREE.Mesh(
          new THREE.BoxGeometry(0.18, 6.5, 0.05),
          new THREE.MeshBasicMaterial({ color: b.color, transparent: true, opacity: 0.85 })
        );
        line.position.set(b.x, -1.5, 0);
        scene.add(line);
        spectra.push(line);
      });

      // Electron on a level + photon packets jumping between levels
      const electron = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xfbbf24 })
      );
      scene.add(electron);
      const photons = [];
      for (let i = 0; i < 8; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.1, 8, 8),
          new THREE.MeshBasicMaterial({ color: balmer[i % 4].color, transparent: true, opacity: 0.9 })
        );
        scene.add(p);
        photons.push({ mesh: p, phase: i * 0.7, from: 3 - (i % 3), to: 1 + (i % 2) });
      }

      // Soft glow rings around electron (cloud hint, not orbits)
      const cloud = [];
      for (let i = 0; i < 40; i++) {
        const c = new THREE.Mesh(
          new THREE.SphereGeometry(0.04, 4, 4),
          new THREE.MeshBasicMaterial({ color: 0x67e8f9, transparent: true, opacity: 0.35 })
        );
        scene.add(c);
        cloud.push(c);
      }

      camera.position.set(1, -1, 12);
      camera.lookAt(0, -1.5, 0);

      function tick(t) {
        // Electron hops between energy levels
        const idx = Math.floor((t * 0.45) % levels.length);
        const next = (idx + 1) % levels.length;
        const blend = ((t * 0.45) % 1);
        const y = levels[idx] * (1 - blend) + levels[next] * blend;
        electron.position.set(-1.5, y, 0);

        cloud.forEach((c, i) => {
          const a = t * 2 + i;
          c.position.set(
            -1.5 + Math.cos(a) * (0.4 + (i % 5) * 0.08),
            y + Math.sin(a * 1.3) * 0.35,
            Math.sin(a * 0.7) * 0.4
          );
        });

        // Photons travel from higher level to spectral panel
        photons.forEach((ph, i) => {
          const u = ((t * 0.35 + ph.phase) % 1);
          const y0 = levels[Math.min(ph.from, levels.length - 1)];
          const y1 = levels[Math.min(ph.to, levels.length - 1)];
          if (u < 0.35) {
            ph.mesh.position.set(-1.5, y0 + (y1 - y0) * (u / 0.35), 0);
            ph.mesh.material.opacity = 1;
          } else {
            const v = (u - 0.35) / 0.65;
            ph.mesh.position.set(-1.5 + v * 6.5, y1 + Math.sin(v * 8) * 0.15, 0);
            ph.mesh.material.opacity = 1 - v;
          }
        });

        spectra.forEach((s, i) => {
          s.material.opacity = 0.45 + 0.45 * Math.abs(Math.sin(t * 1.5 + i));
          s.scale.y = 0.92 + 0.08 * Math.sin(t * 2 + i);
        });
        levelBars.forEach((b, i) => {
          b.material.opacity = 0.4 + 0.4 * Math.abs(Math.sin(t + i * 0.5));
        });
      }
  let t0 = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    const t = (performance.now() - t0) / 1000;
    tick(t);
    renderer.render(scene, camera);
  }
  animate();
  addEventListener('resize', size);
  })();
</script>

<script>
(function(){
  window.addEventListener('load', function(){
    setTimeout(function(){
      if (document.getElementById('__lf-ctl')) return;
      var pages = [].slice.call(document.querySelectorAll('.page'));
      if (!pages.length) return;
      var i = 0, step = 0;
      var steps = function(p){ return [].slice.call(p.querySelectorAll('.step')); };
      function render(){
        pages.forEach(function(p,k){ p.style.display = k===i ? '' : 'none'; });
        steps(pages[i]).forEach(function(s,k){
          s.style.transition = 'opacity .4s, transform .4s';
          s.style.opacity = k < step ? '1' : '0';
          s.style.transform = k < step ? 'none' : 'translateY(14px)';
        });
      }
      function next(){ var n = steps(pages[i]).length;
        if (step < n) step++; else if (i < pages.length-1){ i++; step = 0; } render(); }
      function prev(){ if (step > 0) step--; else if (i > 0){ i--; step = steps(pages[i]).length; } render(); }
      document.addEventListener('keydown', function(e){
        if (e.key === 'ArrowRight' || e.key === ' ') next();
        else if (e.key === 'ArrowLeft') prev();
      });
      render();
    }, 250);
  });
})();
</script>
</body>
</html>

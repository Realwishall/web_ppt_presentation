<!-- Slide 13 — Human eye, cross-section -->
<section class="page">
  <div class="wrap dense">
    <h2 class="heading">The Human Eye &#8212; cross-section</h2>

    <div class="figure-frame plain tall">
      <svg viewBox="0 0 1280 770" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Labelled cross-section of the human eye">

        <!-- ---------- the eyeball itself (always visible) ---------- -->
        <!-- extraocular muscles -->
        <g fill="#cf4552">
          <path d="M470,118 L582,80 L600,124 L488,162 Z"/>
          <path d="M470,642 L582,680 L600,636 L488,598 Z"/>
        </g>

        <!-- concentric coats: sclera / choroid / retina / vitreous -->
        <circle cx="620" cy="380" r="292" fill="#c3d3ea"/>
        <circle cx="620" cy="380" r="272" fill="#d43b4c"/>
        <circle cx="620" cy="380" r="256" fill="#f3e3a3"/>
        <circle cx="620" cy="380" r="242" fill="#d9a4aa"/>

        <!-- optic nerve leaving at the back -->
        <path d="M860,318 L1130,300 L1130,430 L860,412 Z" fill="#f3e3a3" stroke="#c9b96b" stroke-width="4"/>
        <path d="M900,362 L1130,362" stroke="#c9b96b" stroke-width="3"/>

        <!-- anterior chamber + cornea -->
        <path d="M408,182 C306,214 252,292 250,380 C252,468 306,546 408,578 Z"
              fill="#dfeaf6" stroke="#7fa8d8" stroke-width="6"/>

        <!-- ciliary muscle -->
        <ellipse cx="416" cy="176" rx="38" ry="24" fill="#d9414f"/>
        <ellipse cx="416" cy="584" rx="38" ry="24" fill="#d9414f"/>

        <!-- crystalline lens -->
        <ellipse cx="414" cy="380" rx="60" ry="106" fill="#eef6fd" stroke="#9dc0e0" stroke-width="5"/>

        <!-- iris (leaves the pupil open in the middle) -->
        <g fill="#c94b57" stroke="#8f2f3a" stroke-width="3">
          <rect x="374" y="186" width="26" height="92" rx="9"/>
          <rect x="374" y="482" width="26" height="92" rx="9"/>
        </g>

        <!-- ---------- labels: one reveal each ---------- -->
        <g font-family="Calibri, Candara, 'Segoe UI', sans-serif" font-size="30" font-weight="700"
           fill="#f2d024" stroke="none">

          <g class="step">
            <text x="16" y="256">Cornea</text>
            <path d="M130,268 L258,318" stroke="#f2d024" stroke-width="3" fill="none"/>
          </g>

          <g class="step">
            <text x="16" y="500">Aqueous humour</text>
            <path d="M210,512 L318,452" stroke="#f2d024" stroke-width="3" fill="none"/>
          </g>

          <g class="step">
            <text x="196" y="86">Iris</text>
            <path d="M244,98 L386,190" stroke="#f2d024" stroke-width="3" fill="none"/>
          </g>

          <g class="step">
            <text x="330" y="46">Pupil</text>
            <path d="M372,58 L400,320" stroke="#f2d024" stroke-width="3" fill="none"/>
          </g>

          <g class="step">
            <text x="120" y="716">Lens</text>
            <path d="M200,704 L406,472" stroke="#f2d024" stroke-width="3" fill="none"/>
          </g>

          <g class="step">
            <text x="404" y="754">Ciliary muscle</text>
            <path d="M446,724 L420,610" stroke="#f2d024" stroke-width="3" fill="none"/>
          </g>

          <g class="step">
            <text x="702" y="52">Retina</text>
            <path d="M746,64 L752,158" stroke="#f2d024" stroke-width="3" fill="none"/>
          </g>

          <g class="step">
            <text x="1000" y="196">Choroid</text>
            <path d="M1000,208 L880,282" stroke="#f2d024" stroke-width="3" fill="none"/>
          </g>

          <g class="step">
            <text x="1030" y="516">Sclera</text>
            <path d="M1032,504 L896,478" stroke="#f2d024" stroke-width="3" fill="none"/>
          </g>

          <g class="step">
            <text x="620" y="754">Vitreous humour</text>
            <path d="M700,724 L680,556" stroke="#f2d024" stroke-width="3" fill="none"/>
          </g>

          <g class="step">
            <text x="1006" y="628">Optic nerve</text>
            <path d="M1050,616 L1030,442" stroke="#f2d024" stroke-width="3" fill="none"/>
          </g>
        </g>
      </svg>
    </div>

    <p class="caption step">Light is bent mostly at the cornea, fine-focused by the lens, and lands on the retina &#8212; where the rod and cone cells sit.</p>
  </div>
</section>
